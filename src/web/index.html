<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEAR Entity Tracker · Scanner</title>
<style>
  :root {
    --bg:#f3f9ff; --panel:#ffffff; --panel-2:#f7fbff; --line:#dbe8f6; --line-2:#e9f1fa;
    --text:#14263b; --muted:#64788f; --faint:#8fa3b8;
    --primary:#0ea5e9; --primary-600:#0284c7; --primary-700:#0369a1; --primary-50:#f0f9ff; --primary-100:#e0f2fe; --primary-200:#bae6fd;
    --g:#15803d; --g-bg:#dcfce7; --g-line:#bbf7d0;
    --r:#dc2626; --r-bg:#fee2e2; --r-line:#fecaca;
    --a:#b45309; --a-bg:#fef3c7; --a-line:#fde68a;
    --b:#0369a1; --p:#7c3aed;
    --shadow:0 1px 2px rgba(15,60,110,.05), 0 8px 24px rgba(14,116,190,.07);
    --radius:14px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; color:var(--text); font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased;
         background:linear-gradient(180deg,#e3f3ff 0,#f3f9ff 260px,#f3f9ff 100%) fixed; }
  a { color:var(--primary-600); text-decoration:none; } a:hover { text-decoration:underline; }
  code, pre { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
  code { background:var(--primary-50); border:1px solid var(--primary-100); border-radius:6px; padding:1px 6px; color:var(--primary-700); }
  pre { background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; }

  /* ---------- layout ---------- */
  .app { display:flex; min-height:100vh; }
  .side { width:250px; flex:0 0 250px; background:var(--panel); border-right:1px solid var(--line); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 14px; overflow-y:auto; }
  .brand { display:flex; align-items:center; gap:11px; padding:4px 8px 18px; color:var(--text); text-decoration:none !important; }
  .logo { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:#fff; flex:0 0 auto;
          background:linear-gradient(135deg,#38bdf8 0%,#0284c7 100%); box-shadow:0 6px 14px rgba(2,132,199,.35); }
  .brand b { display:block; font-size:15px; letter-spacing:.2px; } .brand small { color:var(--muted); font-size:11.5px; }
  .nav-group { margin:10px 0 4px; padding:0 10px; font-size:10.5px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--faint); }
  #nav a { display:flex; align-items:center; gap:11px; padding:8px 11px; margin:2px 0; border-radius:10px; color:#3b5068; font-weight:500; text-decoration:none; transition:background .12s,color .12s; }
  #nav a svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; opacity:.85; }
  #nav a:hover { background:var(--primary-50); color:var(--primary-700); }
  #nav a.on { background:linear-gradient(90deg,var(--primary-100),#f0f9ff); color:var(--primary-700); font-weight:650; box-shadow:inset 3px 0 0 var(--primary); }
  .side-foot { margin-top:auto; padding:12px 10px 2px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line-2); }
  .content { flex:1; min-width:0; }
  .top { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; padding:26px 32px 6px; max-width:1560px; margin:0 auto; }
  .top h1 { margin:0; font-size:24px; letter-spacing:-.2px; } .top .sub { margin:3px 0 0; color:var(--muted); font-size:13px; }
  #status { color:var(--primary-700); background:var(--primary-100); border:1px solid var(--primary-200); padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600; }
  #status:empty { display:none; }
  main { padding:16px 32px 48px; max-width:1560px; margin:0 auto; transition:opacity .15s; }
  main.loading { opacity:.55; }

  /* ---------- cards, headings ---------- */
  section { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; overflow-x:auto; box-shadow:var(--shadow); }
  section > h2:first-child, section > .bar:first-child h2 { margin-top:0; }
  h2 { font-size:15px; margin:0 0 12px; color:var(--text); font-weight:650; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  h2::before { content:""; width:4px; height:16px; border-radius:3px; background:linear-gradient(180deg,#38bdf8,#0284c7); flex:0 0 auto; }
  h2 .muted { font-weight:400; font-size:12.5px; }
  h3 { font-size:11.5px; margin:20px 0 8px; color:var(--primary-700); font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
  .muted { color:var(--muted); }
  .g { color:var(--g); } .r { color:var(--r); } .a { color:var(--a); } .b { color:var(--b); } .p { color:var(--p); }
  .wrap { white-space:normal; }
  section.a { background:var(--a-bg); border-color:var(--a-line); } section.r { background:var(--r-bg); border-color:var(--r-line); }

  /* ---------- tables ---------- */
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
  th { position:sticky; top:0; text-align:left; padding:9px 12px; font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--primary-700); background:var(--primary-50); border-bottom:1px solid var(--primary-200); white-space:nowrap; }
  th:first-child { border-top-left-radius:10px; } th:last-child { border-top-right-radius:10px; }
  td { padding:9px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--primary-50); }
  tr.click:hover td:first-child { box-shadow:inset 3px 0 0 var(--primary); }

  /* ---------- KPI cards ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; }
  .kpi { border:1px solid var(--line); border-radius:12px; padding:13px 15px; background:linear-gradient(160deg,#ffffff 0%,#f2f9ff 100%); position:relative; overflow:hidden; }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,#38bdf8,#0284c7); }
  .kpi > span { font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.3px; }
  .kpi b { display:block; font-size:22px; line-height:1.2; margin-top:4px; letter-spacing:-.3px; }

  /* ---------- controls ---------- */
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  input, select, button { background:#fff; color:var(--text); border:1px solid var(--line); border-radius:9px; padding:7px 11px; font:inherit; font-size:13px; transition:border-color .12s, box-shadow .12s, background .12s; }
  input:focus, select:focus { outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,165,233,.18); }
  input[type=search] { min-width:230px; }
  button { cursor:pointer; font-weight:600; color:var(--primary-700); border-color:var(--primary-200); background:var(--primary-50); }
  button:hover:not(:disabled) { background:var(--primary-100); border-color:var(--primary); }
  button:disabled { opacity:.4; cursor:default; }
  td button { padding:3px 9px; font-size:12px; margin-right:3px; }

  /* ---------- pills, tags ---------- */
  .v { display:inline-block; padding:1px 10px; border-radius:999px; border:1px solid var(--line); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .v.good { color:var(--g); background:var(--g-bg); border-color:var(--g-line); } .v.bad { color:var(--r); background:var(--r-bg); border-color:var(--r-line); }
  .v.neutral { color:var(--a); background:var(--a-bg); border-color:var(--a-line); } .v.unknown { color:var(--muted); background:#eef3f8; border-color:var(--line); }
  .tag { display:inline-block; padding:0 8px; border:1px solid var(--primary-200); background:var(--primary-50); border-radius:999px; font-size:11px; font-weight:600; color:var(--primary-700); margin-right:4px; }

  /* ---------- drawer ---------- */
  #drawer { position:fixed; top:0; right:-920px; width:900px; max-width:100vw; height:100vh; overflow:auto; background:var(--panel); border-left:1px solid var(--line); padding:0 26px 40px; transition:right .22s cubic-bezier(.2,.8,.2,1); z-index:30; }
  #drawer.open { right:0; box-shadow:-24px 0 60px rgba(8,47,90,.18); }
  #drawer > button { position:sticky; top:0; float:right; margin:16px 0 0 10px; z-index:2; }
  #drawer h2 { font-size:18px; margin-top:20px; }
  #drawer p { margin:5px 0; }
  #scrim { display:none; position:fixed; inset:0; background:rgba(8,47,90,.28); backdrop-filter:blur(1.5px); z-index:20; }
  #drawer.open + #scrim { display:block; }
  .ai { border:1px solid var(--primary-200); border-left:4px solid var(--primary); background:linear-gradient(160deg,#f5fbff,#ffffff); border-radius:12px; padding:14px 16px; margin:12px 0; }
  ul.flags { margin:4px 0 8px 18px; padding:0; } ul.flags li { margin:3px 0; }
  svg.graph { width:100%; background:#f8fcff; border:1px solid var(--line); border-radius:12px; }
  .legend { margin-top:6px; font-size:12px; } .legend span { margin-right:14px; }

  @media (max-width:960px) {
    .app { flex-direction:column; }
    .side { position:static; width:auto; height:auto; flex:none; flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 12px; gap:6px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { padding:0 10px 0 0; } .nav-group, .side-foot { display:none; }
    #nav { display:flex; flex-wrap:wrap; gap:4px; } #nav a { padding:6px 10px; }
    .top, main { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="/monitor" onclick="return nav(event,'/monitor')">
      <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/></svg></span>
      <span><b>Entity Tracker</b><small>NEAR launchpads · early money</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">Powered by <a href="https://trustflow.vn" target="_blank" rel="noopener" style="color:inherit;font-weight:600">Trustflow.vn</a><br><span id="sideNote"></span></div>
  </aside>
  <div class="content">
    <header class="top"><div><h1 id="pageTitle">Monitor</h1><p class="sub" id="pageSub"></p></div><span id="status"></span></header>
    <main id="main"></main>
  </div>
</div>
<div id="drawer"><button onclick="closeDrawer()">Close ✕</button><div id="drawerBody"></div></div>
<div id="scrim" onclick="closeDrawer()"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n = (x, d = 2) => (x == null || Number.isNaN(+x) ? '–' : (+x).toLocaleString('en-US', { maximumFractionDigits: d }));
const pct = (x, d = 0) => (x == null ? '–' : (x * 100).toFixed(d) + '%');
const when = (ts) => (ts ? new Date(ts).toLocaleString() : '–');
const ago = (ms) => { if (ms == null) return '–'; const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };
const short = (a, k = 18) => (a && a.length > k ? a.slice(0, k - 2) + '…' : a || '–');
const roiCls = (r) => (r == null ? 'muted' : r > 0 ? 'g' : r < 0 ? 'r' : 'muted');
const vb = (v) => `<span class="v ${esc(v || 'unknown')}">${esc(v || 'unknown')}</span>`;
const tags = (t) => (t || []).map((x) => `<span class="tag">${esc(x)}</span>`).join('');
const get = async (path, params) => { const q = params ? '?' + new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null)) : ''; const r = await fetch(path + q); const j = await r.json(); if (j.error && !j.rows && !j.now && !j.nodes) throw new Error(j.error); return j; };
// ---- links: every wallet / contract / transaction goes to NearBlocks, every token to its launchpad's token page
const NB = 'https://nearblocks.io', STOP = ' onclick="event.stopPropagation()"'; // a link inside a clickable row must not also open the row
const ext = (url, text, title) => `<a href="${url}" target="_blank" rel="noopener" title="${esc(title ?? text)}"${STOP}>${esc(text)}</a>`;
const ACCT_RE = /^[a-z0-9][a-z0-9._-]*$/;
/** A wallet / contract account -> NearBlocks address page. Anything that is not an account id (labels, composite keys) is plain text. */
const acct = (a, k = 24) => (a ? (ACCT_RE.test(a) ? ext(`${NB}/address/${encodeURIComponent(a)}`, short(a, k), a) : esc(short(a, k))) : '–');
const nb = (a) => acct(a, 22);
/** A transaction hash -> NearBlocks transaction page. */
const txl = (h) => (h ? ext(`${NB}/txns/${encodeURIComponent(h)}`, String(h).slice(0, 8) + '…', h) : '–');
// meme.cooking token pages use the meme id, which is not in the token account: the server lists them once
let MEME = {};
const loadMemeIds = () => fetch('/api/meme-ids').then((r) => r.json()).then((j) => { MEME = j.ids || {}; }).catch(() => {});
const padOf = (id) => (/\.nearlytrade\.near$/.test(id) ? 'nearlytrade' : /\.launchpad\.justhoot\.near$/.test(id) ? 'justhoot' : null);
const tokUrl = (id, lp) => {
  lp = lp || padOf(id);
  const e = encodeURIComponent(id);
  if (lp === 'nearlytrade') return `https://nearly.trade/${e}`;
  if (lp === 'justhoot') return `https://justhoot.fun/p/${e}`;
  if (lp === 'memecooking' && MEME[id]) return `https://meme.cooking/meme/${MEME[id]}`;
  return `${NB}/token/${e}`; // no launchpad page known for this token
};
/** A token -> its launchpad's token detail page (nearly.trade, justhoot.fun, meme.cooking), NearBlocks otherwise. */
const tokLink = (id, lp, k = 26) => (id ? ext(tokUrl(id, lp), short(id, k), id) : '–');

const ST = { scans: { kind: '', pass: '', bought: '', q: '', offset: 0 }, entities: { type: '', q: '', sort: 'funded', offset: 0 }, groups: { verdict: '', q: '', sort: 'size', offset: 0 }, wallets: { q: '', verdict: '', sort: 'tokens', offset: 0 }, tokens: { q: '', status: '', rugged: '', offset: 0 }, logs: { level: '' } };
const views = {};

// ------------------------------------------------------------------ overview
views.overview = async () => {
  const o = await get('/api/overview');
  const W = o.worker, ai = o.ai;
  $('status').textContent = `worker ${W ? ago(o.now - W.ts) + ' ago' : 'not seen'} · AI ${ai.enabled ? (ai.ok === false ? 'error' : ai.model) : 'off'} · db ${o.db}`;
  const kpi = (l, v, c = '') => `<div class="kpi"><span class="muted">${l}</span><b class="${c}">${v}</b></div>`;
  const cv = Object.fromEntries(o.clusterVerdict.map((x) => [x.verdict, x]));
  const gl = (v) => (cv[v] ? `${cv[v].n} <span class="muted" style="font-size:12px">(${cv[v].wallets} wallets)</span>` : '0');
  return `<section><div class="grid">
    ${kpi('Tokens tracked', n(o.tokens, 0))}${kpi('Early entries', n(o.entries, 0))}${kpi('Early wallets', n(o.wallets, 0) + ` <span class="muted" style="font-size:12px">(${n(o.profiled, 0)} profiled)</span>`)}
    ${kpi('Good groups', gl('good'), 'g')}${kpi('Bad groups', gl('bad'), 'r')}${kpi('Neutral', gl('neutral'), 'a')}${kpi('Unknown (few tokens)', gl('unknown'), 'muted')}
  </div></section>
  ${ai.enabled ? '' : '<section class="a">NEAR AI is off (set NEAR_AI_API_KEY). Groups get rule-based verdicts only.</section>'}
  ${ai.enabled && ai.ok === false ? `<section class="r">NEAR AI error: ${esc(ai.error || '')}</section>` : ''}
  <section><h2>Top good groups</h2>${groupTable(o.topGood)}</section>
  <section><h2>Largest bad groups</h2>${groupTable(o.topBad)}</section>
  <section><h2>Latest launches</h2><table><tr><th>Live</th><th>Token</th><th>Pad</th><th>Status</th><th>Early</th><th>Peak x</th><th>Rug</th></tr>
    ${o.latest.map((t) => `<tr class="click" data-id="${esc(t.id)}" onclick="openToken(this.dataset.id)"><td>${when(t.live_ts)}</td><td><b>${esc(t.symbol || '')}</b> ${tokLink(t.id, t.launchpad, 28)}</td><td>${esc(t.launchpad)}</td><td>${esc(t.status)}</td><td>${t.entries_n ?? '–'}</td><td>${n(t.outcome?.peak_multiple, 1)}</td><td class="${t.outcome?.rugged ? 'r' : 'muted'}">${t.outcome?.rugged ? 'RUG' : '–'}</td></tr>`).join('')}</table></section>`;
};
const groupTable = (rows) => `<table><tr><th>Group</th><th>Label</th><th>Wallets</th><th>Score</th><th>Tokens</th><th>Win</th><th>Rug</th><th>P&amp;L N</th></tr>
  ${rows.map((c) => `<tr class="click" data-id="${esc(c.id)}" onclick="openGroup(this.dataset.id)"><td>${esc(c.id)}</td><td>${esc(c.ai?.label || (c.rule?.tags || []).join(', ') || '–')}</td><td>${c.size}</td><td>${n(c.score, 0)}</td><td>${c.metrics?.tokens_n ?? '–'}</td><td>${pct(c.metrics?.win_rate)}</td><td>${pct(c.metrics?.rug_share)}</td><td class="${roiCls(c.metrics?.pnl_near)}">${n(c.metrics?.pnl_near, 1)}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">none yet</td></tr>'}</table>`;

// ------------------------------------------------------------------ signals
views.signals = async () => {
  const j = await get('/api/signals', { hours: 72 });
  const cls = { bullish: 'g', warning: 'r', mixed: 'a' };
  return `<section><h2>Signals: recent tokens where known good / bad groups were among the early buyers <span class="muted">(last 72 h)</span></h2><table>
    <tr><th>Live</th><th>Token</th><th>Pad</th><th>Assessment</th><th>Good</th><th>Bad</th><th>Early wallets</th><th>Groups</th><th>Now</th></tr>
    ${j.rows.map((s) => `<tr class="click" data-id="${esc(s.token)}" onclick="openToken(this.dataset.id)"><td>${when(s.live_ts)}</td><td><b>${esc(s.symbol || '')}</b> ${tokLink(s.token, s.launchpad, 26)}</td><td>${esc(s.launchpad)}</td>
      <td class="${cls[s.assessment] || ''}"><b>${esc(s.assessment)}</b></td><td class="g">${s.good.w} w · ${n(s.good.near, 0)} N (${pct(s.good_share)})</td><td class="r">${s.bad.w} w · ${n(s.bad.near, 0)} N (${pct(s.bad_share)})</td><td>${s.early_wallets}</td>
      <td class="wrap">${s.groups.slice(0, 3).map((g) => `${vb(g.verdict)} ${esc(g.label || g.id)} (${g.wallets})`).join(' · ')}</td>
      <td>${s.outcome ? (s.outcome.rugged ? '<span class="r">RUG</span> ' : '') + 'x' + n(s.outcome.last_multiple, 1) : '–'}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">no signals yet: needs profiled wallets and evaluated groups</td></tr>'}</table></section>`;
};

// ------------------------------------------------------------------ groups
views.groups = async () => {
  const S = ST.groups, j = await get('/api/clusters', { verdict: S.verdict, q: S.q, sort: S.sort, limit: 50, offset: S.offset });
  const sel = (k, v, l) => `<option value="${v}" ${S[k] === v ? 'selected' : ''}>${l}</option>`;
  return `<section><div class="bar"><h2 style="margin:0">Groups</h2>
    <select onchange="ST.groups.verdict=this.value;ST.groups.offset=0;render()">${sel('verdict', '', 'all verdicts')}${['good', 'bad', 'neutral', 'unknown'].map((v) => sel('verdict', v, v)).join('')}</select>
    <select onchange="ST.groups.sort=this.value;render()">${sel('sort', 'size', 'by size')}${sel('sort', 'score', 'by score')}${sel('sort', 'pnl', 'by P&L')}${sel('sort', 'recent', 'most recent entry')}</select>
    <input id="gq" type="search" placeholder="wallet / group id / label" value="${esc(S.q)}" onkeydown="if(event.key==='Enter'){ST.groups.q=this.value;ST.groups.offset=0;render()}">
    <span class="muted">${n(j.total, 0)} groups</span>
    <button ${S.offset ? '' : 'disabled'} onclick="ST.groups.offset=Math.max(0,ST.groups.offset-50);render()">◀</button><button ${S.offset + 50 < j.total ? '' : 'disabled'} onclick="ST.groups.offset+=50;render()">▶</button></div>
    <table><tr><th>Group</th><th>Verdict</th><th>Label</th><th>Tags</th><th>Wallets</th><th>Score</th><th>Tokens</th><th>Win</th><th>Rug</th><th>Insider</th><th>ROI</th><th>P&amp;L N</th><th>Last entry</th></tr>
    ${j.rows.map((c) => `<tr class="click" data-id="${esc(c.id)}" onclick="openGroup(this.dataset.id)"><td>${esc(c.id)}</td><td>${vb(c.verdict)}${c.verdict_source === 'ai' ? ' <span class="tag">AI</span>' : ''}</td><td>${esc(c.ai?.label || '–')}</td><td>${tags(c.rule?.tags)}</td><td>${c.size}</td><td>${n(c.score, 0)}</td>

// Layered picture: funders on top, member wallets in the middle, destinations of NEAR at the bottom.
function graphSvg(g) {
  if (!g.nodes?.length) return '<p class="muted">no graph data</p>';
  const nodes = new Map(g.nodes.map((x) => [x.id, { ...x, level: x.member ? 0 : null }]));
  const fund = g.edges.filter((e) => e.type === 'fund'), flow = g.edges.filter((e) => e.type === 'flow');
  // funders: one level above whoever they fund
  for (let pass = 0; pass < 6; pass++) for (const e of fund) { const c = nodes.get(e.to), f = nodes.get(e.from); if (c && f && c.level != null && (f.level == null || f.level > c.level - 1)) f.level = c.level - 1; }
  for (const e of flow) { const d = nodes.get(e.to); if (d && d.level == null) d.level = 1; }
  for (const x of nodes.values()) if (x.level == null) x.level = -1;
  const levels = [...new Set([...nodes.values()].map((x) => x.level))].sort((a, b) => a - b);
  const W = 820, rowH = 110, H = levels.length * rowH + 30;
  const pos = new Map();
  levels.forEach((lv, li) => { const row = [...nodes.values()].filter((x) => x.level === lv); row.forEach((x, i) => pos.set(x.id, { x: 20 + ((i + 0.5) * (W - 40)) / row.length, y: 30 + li * rowH })); });
  const color = (x) => (x.member ? '#0284c7' : x.kind === 'wallet' || x.kind == null ? '#f59e0b' : '#94a3b8');
  const edgeSvg = g.edges.map((e) => { const a = pos.get(e.from), b = pos.get(e.to); if (!a || !b) return ''; const col = e.type === 'fund' ? '#16a34a' : '#ef4444';
    return `<path d="M${a.x},${a.y} C${a.x},${(a.y + b.y) / 2} ${b.x},${(a.y + b.y) / 2} ${b.x},${b.y}" fill="none" stroke="${col}" stroke-opacity=".5" stroke-width="${Math.min(3, 0.6 + Math.log10(1 + (e.near || 0)))}"><title>${esc(e.type)} ${esc(short(e.from, 20))} → ${esc(short(e.to, 20))} ${n(e.near, 2)} N</title></path>`; }).join('');
  const nodeSvg = [...nodes.values()].map((x) => { const p = pos.get(x.id); return `<a href="${NB}/address/${encodeURIComponent(x.id)}" target="_blank" rel="noopener" style="cursor:pointer"><g><circle cx="${p.x}" cy="${p.y}" r="${x.member ? 7 : 5}" fill="${color(x)}"><title>${esc(x.id)}${x.kind ? ' · ' + esc(x.kind) : ''}${x.tx_count != null ? ' · ' + x.tx_count + ' txs' : ''}</title></circle>${nodes.size <= 40 ? `<text x="${p.x}" y="${p.y + 18}" fill="#64788f" font-size="9" text-anchor="middle">${esc(short(x.id, 14))}</text>` : ''}</g></a>`; }).join('');
  return `<svg class="graph" viewBox="0 0 ${W} ${H}">${edgeSvg}${nodeSvg}</svg>`;
}

const LV = { low: 'good', medium: 'neutral', high: 'bad', critical: 'bad', unrated: 'unknown', high_trust: 'good' };
const CAT = { critical: 'Critical', ownership: 'Ownership & control', trading: 'Trading', liquidity: 'Liquidity', trust: 'Trust signals' };
const gauge = (label, score, level, kind) => {

function auditBody(a) {
  if (a.error) return `<section class="r">${esc(a.error)}</section>`;
  if (a.notFound) return `<section class="a">${esc(a.address)}: there is no contract deployed on this account (a plain wallet), nothing to audit.</section>`;

    <div class="grid">${gauge('Risk score (higher = riskier)', a.risk.score, a.risk.level, 'risk')}${gauge('Trust score', a.trust.score, a.trust.level, 'trust')}
    <div class="kpi"><span>Full-access keys</span><b>${sum.full_access_keys ?? '–'}</b></div><div class="kpi"><span>Confirmed malicious findings</span><b class="${(sum.confirmed_malicious || []).length ? 'r' : 'g'}">${(sum.confirmed_malicious || []).length}</b></div>
    <div class="kpi"><span>Recent sells</span><b>${sum.sells ? sum.sells.ok + ' ok / ' + sum.sells.failed + ' failed' : '–'}</b></div></div>`;
  if ((sum.confirmed_malicious || []).length) h += `<p class="r"><b>Confirmed:</b> ${sum.confirmed_malicious.map((c) => esc(c.key) + (c.detail ? ' (' + esc(c.detail) + ')' : '')).join(' · ')}</p>`;
  h += '</section>';
  const all = [...a.risk.factors, ...a.trust.factors.filter((f) => !a.risk.factors.some((x) => x.key === f.key))];
  const groups = {};
  for (const f of all) (groups[f.category] ||= []).push(f);
  h += '<section><h2>Checklist <span class="muted">every criterion that was evaluated, not only the ones that tripped</span></h2><table><tr><th>Result</th><th>Check</th><th>Weight</th><th>Detail</th></tr>' +
    ['critical', 'ownership', 'trading', 'liquidity', 'trust'].filter((c) => groups[c]).map((c) => `<tr><td colspan="4" style="background:var(--primary-50);font-weight:700;color:var(--primary-700)">${CAT[c]}</td></tr>` + groups[c].map((f) => `<tr><td>${f.category === 'trust' ? (f.hit ? '<span class="v good">earned</span>' : '<span class="v unknown">not earned</span>') : f.hit ? (f.weight > 0 ? '<span class="v bad">hit</span>' : '<span class="v unknown">note</span>') : '<span class="v good">pass</span>'}</td><td class="wrap">${esc(f.label)}</td><td class="${f.hit && f.weight > 0 ? 'r' : 'muted'}">${f.weight > 0 ? '+' : ''}${f.weight}</td><td class="wrap muted">${esc(f.detail || '')}</td></tr>`).join('')).join('') + '</table></section>';
  const code = a.raw?.code;
  if (code) h += `<section><h2>Code <span class="muted">${code.exports.length} exported functions</span></h2>${code.fakeStorage.length ? `<p class="r">Fake storage methods: ${code.fakeStorage.map(esc).join(', ')}</p>` : ''}${(code.privilegedNames || []).length ? `<p class="a">Privileged methods: ${code.privilegedNames.map(esc).join(', ')}</p>` : ''}${code.nonStandard.length ? `<p>Non-standard methods: ${code.nonStandard.map(esc).join(', ')}</p>` : '<p class="muted">No methods outside the standards.</p>'}</section>`;
  if (a.raw?.tax) h += `<section><h2>Launchpad tax</h2><pre>${esc(JSON.stringify(a.raw.tax, null, 1))}</pre></section>`;
  return h;
}

const lineSvg = (pts, { fmt = (v) => n(v, 2), base = null } = {}) => {
  if (pts.length < 2) return '<p class="muted">not enough data points yet (a point is stored every 5 minutes while the worker runs)</p>';
  const W = 820, H = 110, xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), lo = Math.min(...ys, base ?? Infinity), hi = Math.max(...ys, base ?? -Infinity);
  const sx = (x) => 8 + ((x - x0) / (x1 - x0 || 1)) * (W - 16), sy = (y) => H - 10 - ((y - lo) / (hi - lo || 1)) * (H - 20);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
  const b = base != null ? `<line x1="0" x2="${W}" y1="${sy(base)}" y2="${sy(base)}" stroke="#bcd3ea" stroke-dasharray="4 4"/>` : '';
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:110px">${b}<path d="${d}" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/></svg><div class="muted" style="display:flex;justify-content:space-between"><span>${esc(when(x0))}</span><span>min ${fmt(lo)} · max ${fmt(hi)}</span><span>${esc(when(x1))}</span></div>`;
};
const scanState = (t, scanCfg) => {
  if (t.status === 'skipped_quote') return '<span class="muted">skipped (quote not tradable)</span>';
  const s = t.scan;
  if (s?.stale) return '<span class="muted">stale</span>';
  if (s?.error) return '<span class="r">error</span>';
  if (s?.score != null) return s.bought ? '<span class="g"><b>BOUGHT (sim)</b></span>' : s.pass ? '<span class="a">gates PASS, no buy</span>' : '<span class="r">gates FAIL</span>';
  const minAge = Math.max(scanCfg.observeSeconds, t.launchpad === 'justhoot' ? scanCfg.justhootMinAgeSeconds : 0) * 1000;
  const left = minAge - (Date.now() - t.live_ts);
  return left > 0 ? `<span class="b">observing, check in ${ago(left)}</span>` : '<span class="b">checking…</span>';
};

async function openScan(id) {
  setUrl('/scans/' + encodeURIComponent(id));
  const s = await get('/api/scan', { id }), f = s.features || {}, ai = s.ai;
  let h = `<h2 style="color:var(--text);font-size:15px">${esc(s.symbol || '')} · ${esc(s.kind)}${s.kind === 'followup' ? ' +' + s.minutes + ' min' : ''} · score <span class="b">${s.score}</span> · gates <span class="${s.pass ? 'g' : 'r'}">${s.pass ? 'PASS' : 'FAIL'}</span></h2><p>${tokLink(s.token, s.launchpad)} · ${when(s.ts)} · ${esc(s.decision || '')}</p>`;

  h += `<h3>All features</h3><pre style="white-space:pre-wrap;color:var(--muted)">${esc(JSON.stringify(f, null, 1))}</pre>`;
  openDrawer(h);
}

  let h = `<h2 style="color:var(--text);font-size:15px">${esc(w.id)}</h2><p>${nb(w.id)} · ${esc(w.kind || '')} · ${w.tx_count ?? '–'} txs · created ${when(w.created_ts)}</p>`;
  if (w.cluster) h += `<p>Group <a href="/groups/${encodeURIComponent(w.cluster.id)}" onclick="openGroup('${esc(w.cluster.id)}');return false">${esc(w.cluster.id)}</a> ${vb(w.cluster.verdict)} ${esc(w.cluster.ai?.label || '')} · ${w.cluster.size} wallets ${tags(w.cluster.rule?.tags)}</p>`;
  h += '<h3>Who funded it (first meaningful inflows, earliest first)</h3><table><tr><th>Account</th><th>Kind</th><th>NEAR</th><th>When</th><th>Tx</th><th>Via</th></tr>' + (w.funders || []).map((f) => `<tr class="click" data-id="${esc(f.account)}" onclick="openEntity(this.dataset.id)"><td>${nb(f.account)}</td><td>${esc(f.kind)}${f.creator_only ? ' <span class="tag">creator only</span>' : ''}</td><td>${n(f.near, 2)}</td><td>${when(f.ts)}</td><td>${txl(f.hash)}</td><td>${esc(f.via || 'transfer')}</td></tr>`).join('') + '</table>';
  h += '<h3>Funding chain</h3><table><tr><th>Hop</th><th>Account</th><th>Kind</th><th>NEAR</th><th>Txs</th></tr>' + (w.chain || []).map((c) => `<tr><td>${c.hop}</td><td>${nb(c.account)}</td><td>${esc(c.kind)}</td><td>${n(c.near, 2)}</td><td>${c.tx_count ?? '–'}</td></tr>`).join('') + '</table>';
  h += '<h3>Where its NEAR went (recent outflows)</h3><table><tr><th>To</th><th>NEAR</th><th>Transfers</th><th>Last</th></tr>' + (w.flow_out || []).map((f) => `<tr><td>${nb(f.to)}</td><td>${n(f.near, 2)}</td><td>${f.n}</td><td>${when(f.last_ts)}</td></tr>`).join('') + '</table>';
  h += '<h3>Early entries</h3><table><tr><th>Bought</th><th>Tx</th><th>Token</th><th>Rank</th><th>Delay</th><th>NEAR in</th><th>ROI 1h</th><th>ROI 6h</th><th>ROI 24h</th><th>Now</th><th>Rug</th></tr>' + w.entries.map((e) => `<tr class="click" data-id="${esc(e.token)}" onclick="openToken(this.dataset.id)"><td>${when(e.first_buy_ts)}</td><td>${txl(e.first_buy_hash)}</td><td><b>${esc(e.symbol || '')}</b> ${tokLink(e.token, e.launchpad, 22)}${e.is_creator ? ' <span class="tag">creator</span>' : ''}</td><td>#${e.rank}</td><td>${e.delay_s}s</td><td>${n(e.buy_near, 1)}</td>
      ${['60', '360', '1440'].map((m) => `<td class="${roiCls(e.roi?.[m])}">${pct(e.roi?.[m])}</td>`).join('')}<td class="${roiCls(e.roi_now)}">${pct(e.roi_now)}</td><td class="${e.rugged ? 'r' : 'muted'}">${e.rugged ? 'RUG' : '–'}</td></tr>`).join('') + '</table>';
  openDrawer(h);
}

// ------------------------------------------------------------------ tokens
views.tokens = async () => {
  const S = ST.tokens, j = await get('/api/tokens', { q: S.q, status: S.status, rugged: S.rugged, limit: 50, offset: S.offset });
  const sel = (k, v, l) => `<option value="${v}" ${S[k] === v ? 'selected' : ''}>${l}</option>`;
  return `<section><div class="bar"><h2 style="margin:0">Tokens</h2>
    <input id="tq" type="search" placeholder="symbol / token / creator" value="${esc(S.q)}" onkeydown="if(event.key==='Enter'){ST.tokens.q=this.value;ST.tokens.offset=0;render()}">
    <select onchange="ST.tokens.status=this.value;ST.tokens.offset=0;render()">${sel('status', '', 'any status')}${['new', 'entries_open', 'tracking', 'done'].map((v) => sel('status', v, v)).join('')}</select>
    <select onchange="ST.tokens.rugged=this.value;ST.tokens.offset=0;render()">${sel('rugged', '', 'all')}${sel('rugged', '1', 'rugged only')}</select>
    <span class="muted">${n(j.total, 0)} tokens</span>
    <button ${S.offset ? '' : 'disabled'} onclick="ST.tokens.offset=Math.max(0,ST.tokens.offset-50);render()">◀</button><button ${S.offset + 50 < j.total ? '' : 'disabled'} onclick="ST.tokens.offset+=50;render()">▶</button></div>
    <table><tr><th>Live</th><th>Symbol</th><th>Token</th><th>Pad</th><th>Status</th><th>Early</th><th>Buyers</th><th>Peak x</th><th>Now x</th><th>Rug</th><th>Creator sold</th></tr>
    ${j.rows.map((t) => `<tr class="click" data-id="${esc(t.id)}" onclick="openToken(this.dataset.id)"><td>${when(t.live_ts)}</td><td><b>${esc(t.symbol || '')}</b></td><td>${tokLink(t.id, t.launchpad, 30)}</td><td>${esc(t.launchpad)}</td><td>${esc(t.status)}</td><td>${t.entries_n ?? '–'}</td><td>${t.outcome?.buyers ?? '–'}</td>
      <td>${n(t.outcome?.peak_multiple, 1)}</td><td>${n(t.outcome?.last_multiple, 1)}</td><td class="${t.outcome?.rugged ? 'r' : 'muted'}">${t.outcome?.rugged ? 'RUG' : '–'}</td><td>${t.outcome?.creator_sold ? 'yes' : '–'}</td></tr>`).join('')}</table></section>`;
};

async function openToken(id) {
  setUrl('/tokens/' + encodeURIComponent(id));
  const t = await get('/api/token', { id }), o = t.outcome || {};
  let h = `<h2 style="color:var(--text);font-size:15px">${esc(t.symbol || '')} ${esc(t.name || '')} ${o.rugged ? '<span class="v bad">RUG</span>' : ''}</h2><p>${tokLink(t.id, t.launchpad)} · ${esc(t.launchpad)} · creator ${t.creator ? nb(t.creator) : '–'} · live ${when(t.live_ts)} · launch tx ${txl(t.live_tx)}</p>`;
  h += `<p class="muted">peak x${n(o.peak_multiple, 1)} · now x${n(o.last_multiple, 1)} · drawdown ${pct(o.drawdown)} · buyers ${o.buyers ?? '–'} · bought ${n(o.buy_near, 0)} N · sold ${n(o.sell_near, 0)} N · creator sold ${o.creator_sold ? 'yes (' + n(o.creator_sell_near, 1) + ' N)' : 'no'}</p>`;
  const au = t.audit;
  h += '<h3>Contract audit</h3>' + (au?.available ? `<p><span class="v ${au.risk_level === 'low' ? 'good' : au.risk_level === 'medium' ? 'neutral' : 'bad'}">risk ${au.risk_score} · ${esc(au.risk_level)}</span> <span class="v ${au.trust_level === 'high' ? 'good' : 'unknown'}">trust ${au.trust_score}</span> · full-access keys ${au.full_access_keys ?? '–'} · ${(au.confirmed_malicious || []).length ? '<span class="r">confirmed: ' + au.confirmed_malicious.map((c) => esc(c.key)).join(', ') + '</span>' : 'no confirmed malicious finding'}</p>${(au.findings || []).length ? '<ul class="flags">' + au.findings.map((f) => `<li>${esc(f.key)} (+${f.weight})${f.detail ? ' <span class="muted">' + esc(f.detail) + '</span>' : ''}</li>`).join('') + '</ul>' : ''}` : '<p class="muted">Not audited yet.</p>') + `<p><a href="/audit/${encodeURIComponent(t.id)}" onclick="closeDrawer();return nav(event,'/audit/${encodeURIComponent(t.id)}')">Open the full audit →</a></p>`;
  h += '<h3>Early buyers</h3><table><tr><th>#</th><th>Wallet</th><th>Group</th><th>Delay</th><th>Buy tx</th><th>NEAR in</th><th>Wallet age</th><th>Funded by</th><th>ROI 1h</th><th>ROI 24h</th><th>Now</th></tr>' + t.entries.map((e) => `<tr class="click" data-id="${esc(e.wallet)}" onclick="openWallet(this.dataset.id)"><td>${e.rank}</td><td>${acct(e.wallet, 24)}${e.is_creator ? ' <span class="tag">creator</span>' : ''}</td>
    <td>${e.cluster ? `${vb(e.cluster.verdict)} ${esc(e.cluster.label || e.cluster.id)} (${e.cluster.size})` : '<span class="muted">solo / unknown</span>'}</td><td>${e.delay_s}s</td><td>${txl(e.first_buy_hash)}</td><td>${n(e.buy_near, 1)}</td><td>${e.wallet_age_days != null ? e.wallet_age_days + ' d' : '–'}</td><td>${esc(e.funder_kind || '–')}</td>
    <td class="${roiCls(e.roi?.['60'])}">${pct(e.roi?.['60'])}</td><td class="${roiCls(e.roi?.['1440'])}">${pct(e.roi?.['1440'])}</td><td class="${roiCls(e.roi_now)}">${pct(e.roi_now)}</td></tr>`).join('') + '</table>';
  openDrawer(h);
}

// ------------------------------------------------------------------ logs
views.logs = async () => {
  const j = await get('/api/logs', { level: ST.logs.level, limit: 300 });
  return `<section><div class="bar"><h2 style="margin:0">Log</h2><select onchange="ST.logs.level=this.value;render()"><option value="">all</option>${['INFO', 'WARN', 'ERROR'].map((l) => `<option ${ST.logs.level === l ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <table>${j.rows.map((r) => `<tr class="${r.level === 'ERROR' ? 'r' : r.level === 'WARN' ? 'a' : ''}"><td class="muted">${when(r.ts)}</td><td>${esc(r.level)}</td><td class="wrap">${esc(r.msg)}</td></tr>`).join('')}</table></section>`;
};

// ------------------------------------------------------------------ shell + router (History API: /config, /groups/<id>, no #)
const TABS = ['audit', 'monitor', 'sim', 'scans', 'overview', 'signals', 'groups', 'entities', 'wallets', 'tokens', 'logs', 'config'];
const ICONS = {
  monitor: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>', sim: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  audit: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  scans: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', overview: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  signals: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>', groups: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  entities: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
  wallets: '<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>', tokens: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
  logs: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>', config: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
};
const NAV = [
  ['Scanner', [['monitor', 'Monitor'], ['sim', 'Simulated wallet'], ['scans', 'Evaluations'], ['audit', 'Contract audit']]],
  ['Early investors', [['overview', 'Overview'], ['signals', 'Signals'], ['groups', 'Groups'], ['entities', 'Entities'], ['wallets', 'Wallets'], ['tokens', 'Tokens']]],
  ['System', [['logs', 'Log'], ['config', 'Settings']]],
];
const TITLES = {
  monitor: ['Monitor', 'Every new launch: first check, hard gates and the AI analyst\'s decision'], sim: ['Simulated wallet', 'Paper trading with real pool quotes: equity, open and closed positions'],
  audit: ['Contract audit', 'Access keys, code, tax and sell behaviour of any NEAR token or contract, scored for risk and trust'],
  scans: ['Evaluations', 'Every gate check and AI review, with the reasons'], overview: ['Overview', 'What the tracker has learned about early investors so far'],
  signals: ['Signals', 'Recent tokens where known good or dangerous groups were among the early buyers'], groups: ['Groups', 'Wallets linked by funding, money flow and co-buying, judged good or bad'],
  entities: ['Entities', 'Exchange wallets, services, funders and destinations around the early investors'], wallets: ['Early wallets', 'Who bought early, who funded them and how they did'],
  tokens: ['Tokens', 'Every launch with its outcome and early buyers'], logs: ['Log', 'Worker activity'], config: ['Settings', 'Read-only view of the configuration in use'],
};
const OPENERS = { audit: (id) => runAudit(id), groups: (id) => openGroup(id), wallets: (id) => openWallet(id), tokens: (id) => openToken(id), entities: (id) => openEntity(id), scans: (id) => openScan(id), sim: (id) => openSimPosition(id) };
function openDrawer(html) { $('drawerBody').innerHTML = html; $('drawer').classList.add('open'); }
function setUrl(path) { if (location.pathname !== path) history.pushState(null, '', path); }
function closeDrawer() {
  $('drawer').classList.remove('open');
  const seg = location.pathname.split('/').filter(Boolean);
  if (seg.length > 1) setUrl('/' + seg[0]); // back to the list page
}
/** Link / tab click: change the path without reloading the page. */
function nav(e, path) {
  if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.button)) return true; // let "open in new tab" work
  if (e) e.preventDefault();
  $('drawer').classList.remove('open');
  setUrl(path);
  render();
  return false;
}
let seq = 0;
async function render() {
  const seg = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const view = views[seg[0]] ? seg[0] : 'monitor';
  const id = seg.length > 1 ? seg.slice(1).join('/') : null;
  if (!seg.length) history.replaceState(null, '', '/' + view); // "/" is shown as /monitor
  $('nav').innerHTML = NAV.map(([group, items]) => `<div class="nav-group">${group}</div>` + items.map(([t, label]) => `<a href="/${t}" onclick="return nav(event,'/${t}')" class="${t === view ? 'on' : ''}"><svg viewBox="0 0 24 24">${ICONS[t]}</svg>${label}</a>`).join('')).join('');
  $('pageTitle').textContent = TITLES[view][0]; $('pageSub').textContent = TITLES[view][1]; document.title = `${TITLES[view][0]} · NEAR Entity Tracker`;
  const my = ++seq;
  $('main').classList.add('loading');
  try { const html = await views[view](); if (my === seq) $('main').innerHTML = html; }
  catch (e) { if (my === seq) $('main').innerHTML = `<section class="r">${esc(e.message)}</section>`; }
  if (my !== seq) return;
  $('main').classList.remove('loading');
  if (id && OPENERS[view]) { try { await OPENERS[view](id); } catch (e) { openDrawer(`<p class="r">${esc(e.message)}</p>`); } }
  else $('drawer').classList.remove('open');
}
window.addEventListener('popstate', render);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
loadMemeIds().then(render);
setInterval(loadMemeIds, 600000);
setInterval(() => { if (!$('drawer').classList.contains('open') && !['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) render(); }, 30000);
</script>
