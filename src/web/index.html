<style>

    --good-soft:rgba(22,163,74,.10); --bad-soft:rgba(225,29,72,.09); --neutral-soft:rgba(217,119,6,.10); --unknown-soft:rgba(148,163,184,.16);

  * { box-sizing:border-box; }

          background:radial-gradient(800px 260px at 10% -20%, var(--accent-soft), transparent 70%), radial-gradient(600px 240px at 100% 0%, rgba(56,189,248,.10), transparent 70%), var(--panel); }

  .banner.bad, .banner.loss { border-color:color-mix(in srgb, var(--bad) 40%, transparent); background:var(--bad-soft); }

  th { text-align:left; padding:8px 12px; font-size:10.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap; vertical-align:middle; }

  /* ---------- pills ---------- */
  .v { display:inline-block; padding:1px 9px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; border:1px solid transparent; white-space:nowrap; }

  .v.win30 { color:var(--win30); background:color-mix(in srgb, var(--win30) 14%, transparent); border-color:color-mix(in srgb, var(--win30) 40%, transparent); }

<header class="topbar">
  <div class="topin">
    <a class="brand" href="/explore" onclick="return navA(event,this)">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.7"/></svg></span>
      <span><b>Safe Near</b><small>Know who is behind the launch</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="search" id="topSearch"></div>
    <div class="status" title="worker / AI status"><i class="dot" id="statusDot"></i><span id="status"></span></div>
    <button class="icon-btn" title="Light / dark" onclick="toggleTheme()"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </div>
  <nav id="subnav" hidden></nav>
</header>
<div class="pagehead" id="pagehead"><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
<main id="main"></main>
<footer><span>Read-only on-chain · tags are evidence, not proof</span><span>Powered by <a href="https://trustflow.vn" target="_blank" rel="noopener">Trustflow.vn</a></span></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (x, d = 2) => (x == null || Number.isNaN(+x) ? '–' : (+x).toLocaleString('en-US', { maximumFractionDigits: d }));
const pct = (x, d = 0) => (x == null || Number.isNaN(+x) ? '–' : (x * 100).toFixed(d) + '%');
const when = (ts) => (ts ? new Date(ts).toLocaleString() : '–');
const ago = (ms) => { if (ms == null || Number.isNaN(ms)) return '–'; const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };
const since = (ts) => (ts ? ago(Date.now() - ts) + ' ago' : '–');
const short = (a, k = 18) => (a && a.length > k ? a.slice(0, k - 2) + '…' : a || '–');
const roiCls = (r) => (r == null ? 'muted' : r > 0 ? 'g' : r < 0 ? 'r' : 'muted');
const signed = (x, d = 1) => (x == null ? '–' : (x > 0 ? '+' : '') + n(x, d));
const TAGS = ['win80', 'win50', 'win30', 'loss', 'unrated'];
const tagOk = (t) => (TAGS.includes(t) ? t : 'unrated');
const TAGHELP = 'win80 / win50 / win30 = ended in profit in 80 / 50 / 30 %+ of the tokens bought early · loss = below 30 % · unrated = fewer than 3 judged tokens';
/** Win-rate tag of a wallet or group (share of its early tokens that ended in profit). */
const tg = (t) => `<span class="v ${tagOk(t)}" title="${esc(TAGHELP)}">${tagOk(t)}</span>`;
const vb = (v) => `<span class="v ${esc(v || 'unknown')}">${esc(v === 'bad' ? 'dangerous' : v || 'unknown')}</span>`;
const tags = (t) => (t || []).map((x) => (x === 'creator-rug' ? '<span class="v bad" title="a token creator in this group rugged or is blacklisted">creator-rug</span> ' : `<span class="chip">${esc(x)}</span>`)).join('');
/** Creator warning chip from { launches, rugged, blacklisted: bool | {reason}, reason }. */
const crChip = (r) => {
  if (!r) return '';
  const bl = r.blacklisted, reason = (bl && typeof bl === 'object' ? bl.reason : r.reason) || '';
  if (bl) return `<span class="v bad" title="${esc(reason || 'on the dev-rug blacklist')}">creator blacklisted</span>`;
  if (r.rugged > 0) return `<span class="v bad" title="${r.rugged} of ${r.launches} launches rugged">creator rugged ${r.rugged}/${r.launches}</span>`;
  return '';
};
const crFlag = (f) => (f === 'blacklisted' ? '<span class="v bad">blacklisted</span>' : f === 'rugger' ? '<span class="v bad">rugger</span>' : f === 'creator' ? '<span class="v unrated">creator</span>' : '');
const get = async (path, params) => { const q = params ? '?' + new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null)) : ''; const r = await fetch(path + q); const j = await r.json(); if (j.error && !j.rows && !j.now && !j.nodes) throw new Error(j.error); return j; };

// ---- external links: every wallet / contract / transaction goes to NearBlocks, every token to its launchpad's token page
const NB = 'https://nearblocks.io', STOP = ' onclick="event.stopPropagation()"'; // a link inside a clickable row must not also open the row
const ext = (url, text, title) => `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title ?? text)}"${STOP}>${esc(text)}</a>`;
const ACCT_RE = /^[a-z0-9][a-z0-9._-]*$/;
const nbAddr = (a) => `${NB}/address/${encodeURIComponent(a)}`;
/** A wallet / contract account -> NearBlocks address page. Anything that is not an account id (labels, composite keys) is plain text. */
const acct = (a, k = 24) => (a ? (ACCT_RE.test(a) ? ext(nbAddr(a), short(a, k), a) : esc(short(a, k))) : '–');
const nb = (a) => acct(a, 22);
/** A transaction hash -> NearBlocks transaction page. */
const txl = (h) => (h ? ext(`${NB}/txns/${encodeURIComponent(h)}`, String(h).slice(0, 8) + '…', h) : '–');
// meme.cooking token pages use the meme id, which is not in the token account: the server lists them once
let MEME = {};
const loadMemeIds = () => fetch('/api/meme-ids').then((r) => r.json()).then((j) => { MEME = j.ids || {}; }).catch(() => {});
const padOf = (id) => (/\.nearlytrade\.near$/.test(id) ? 'nearlytrade' : /\.(v2-)?launchpad\.justhoot\.near$/.test(id) ? 'justhoot' : null);
const tokUrl = (id, lp) => {
  lp = lp || padOf(id);
  const e = encodeURIComponent(id);
  if (lp === 'nearlytrade') return `https://nearly.trade/${e}`;
  if (lp === 'justhoot') return `https://justhoot.fun/p/${e}`;
  if (lp === 'memecooking' && MEME[id]) return `https://meme.cooking/meme/${MEME[id]}`;
  return `${NB}/token/${e}`; // no launchpad page known for this token
};
/** A token -> its launchpad's token detail page (nearly.trade, justhoot.fun, meme.cooking), NearBlocks otherwise. */
const tokLink = (id, lp, k = 26) => (id ? ext(tokUrl(id, lp), short(id, k), id) : '–');

// ---- internal links: tokens, wallets and groups each have their own page
const P = { creator: (id) => '/creators/' + encodeURIComponent(id), tok: (id) => '/tokens/' + encodeURIComponent(id), wal: (id) => '/wallets/' + encodeURIComponent(id), grp: (id) => '/groups/' + encodeURIComponent(id),
  ent: (id) => '/entities/' + encodeURIComponent(id), scan: (id) => '/scans/' + encodeURIComponent(id), sim: (id) => '/sim/' + encodeURIComponent(id), audit: (id) => '/audit/' + encodeURIComponent(id) };
const row = (path) => `data-href="${esc(path)}" onclick="rowNav(event,this)"`;
const ilink = (path, html, title) => `<a href="${esc(path)}" onclick="event.stopPropagation();return navA(event,this)"${title ? ` title="${esc(title)}"` : ''}>${html}</a>`;
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const avatar = (id, label, size = 30) => `<span class="av" style="--h:${hue(id)};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px">${esc(String(label || id || '?').replace(/^[^a-z0-9]+/i, '').slice(0, 2).toUpperCase() || '?')}</span>`;
/** Token cell: avatar, symbol -> token page, account and a launchpad link. */
const tokCell = (id, sym, lp, k = 26) => `<span class="ent">${avatar(id, sym)}<span><b>${ilink(P.tok(id), esc(sym || short(id, 16)), id)}</b><small><span class="acct">${esc(short(id, k))}</span> ${ext(tokUrl(id, lp), '↗', 'open on ' + (lp || padOf(id) || 'NearBlocks'))}</small></span></span>`;
/** Wallet cell: account -> wallet page, plus NearBlocks. Non-account keys stay plain text. */
const walLink = (id, k = 24) => (!id ? '–' : ACCT_RE.test(id) ? `<span class="acct">${ilink(P.wal(id), esc(short(id, k)), id)}</span> ${ext(nbAddr(id), '↗', 'NearBlocks: ' + id)}` : esc(short(id, k)));
const VCOL = { win80: 'var(--win80)', win50: 'var(--win50)', win30: 'var(--win30)', loss: 'var(--loss)', unrated: 'var(--unknown)', solo: 'var(--solo)' };
const gchip = (g) => `<a class="gchip" href="${esc(P.grp(g.id))}" onclick="event.stopPropagation();return navA(event,this)" title="${esc((g.label || g.id) + ' · ' + tagOk(g.tag))}"><i style="background:${VCOL[tagOk(g.tag)]}"></i><span>${esc(short(g.label || g.id, 26))}</span>${g.wallets != null ? `<span class="muted">${g.wallets}w</span>` : ''}</a>`;
const tile = (label, value, sub, cls = '') => `<div class="tile"><span>${label}</span><b class="${cls}">${value}</b>${sub != null && sub !== '' ? `<small>${sub}</small>` : ''}</div>`;
const crumbs = (items) => `<div class="crumbs">${items.map(([l, p]) => (p ? ilink(p, esc(l)) : `<span>${esc(l)}</span>`)).join(' / ')}</div>`;
const empty = (cols, text) => `<tr><td colspan="${cols}" class="muted">${text}</td></tr>`;

// ---- early money split by win-rate tag (the group's tag, or the wallet's own when it has no group)
const MIXV = [['win80', 'win80 · profit in 80 %+ of tokens'], ['win50', 'win50 · 50 %+'], ['win30', 'win30 · 30 %+'], ['loss', 'loss · below 30 %'], ['unrated', 'unrated · too few tokens']];
const mixTotal = (m) => MIXV.reduce((s, [v]) => s + (m?.[v]?.near || 0), 0);
const mixBar = (m, cls = '') => {
  const tot = mixTotal(m);
  if (!tot) return '<div class="mix ' + cls + '"></div>';
  return `<div class="mix ${cls}">${MIXV.map(([v, l]) => { const x = m[v]?.near || 0; return x ? `<i class="${v}" style="width:${((x / tot) * 100).toFixed(2)}%" title="${l}: ${n(x, 1)} N · ${m[v].w} wallets (${pct(x / tot)})"></i>` : ''; }).join('')}</div>`;
};
const mixLegend = (m) => { const tot = mixTotal(m) || 1; return `<div class="mixlegend">${MIXV.map(([v, l]) => `<div><small><span class="lg-dot ${v}"></span>${l}</small><b>${pct((m[v]?.near || 0) / tot)}</b><small>${n(m[v]?.near || 0, 1)} N · ${m[v]?.w || 0} wallets</small></div>`).join('')}</div>`; };
const mixCell = (m) => { const tot = mixTotal(m); if (!tot) return '<span class="muted">no early buyers yet</span>'; const w = MIXV.reduce((s, [v]) => s + (m[v]?.w || 0), 0);
  return `<div class="mixcell">${mixBar(m)}<small>${w} wallets · ${n(tot, 0)} N · <span class="g">${pct(((m.win80?.near || 0) + (m.win50?.near || 0)) / tot)}</span> / <span class="r">${pct((m.loss?.near || 0) / tot)}</span></small></div>`; };
const wavg = (pairs) => { const w = pairs.reduce((s, [, x]) => s + (x || 0), 0); return w ? pairs.reduce((s, [r, x]) => s + r * (x || 0), 0) / w : null; };

// ---- list state, filters, pager
const ST = { scans: { kind: '', pass: '', bought: '', q: '', offset: 0 }, entities: { type: '', q: '', sort: 'funded', offset: 0 }, groups: { tag: '', q: '', sort: 'size', offset: 0 },
  wallets: { q: '', tag: '', sort: 'tokens', offset: 0 }, creators: { q: '', filter: '', sort: '', offset: 0 }, tokens: { q: '', tab: '', status: '', launchpad: '', offset: 0 }, signals: { hours: 72 }, logs: { level: '' } };
const setSt = (view, field, value, reset = true) => { ST[view][field] = value; if (reset && 'offset' in ST[view]) ST[view].offset = 0; render(); };
const sel = (view, field, opts) => `<select onchange="setSt('${view}','${field}',this.value)">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(ST[view][field]) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const seg = (view, field, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${String(ST[view][field]) === String(v) ? 'on' : ''}" onclick="setSt('${view}','${field}','${esc(v)}')">${esc(l)}</button>`).join('')}</div>`;
const qbox = (view, ph) => `<input type="search" placeholder="${esc(ph)}" value="${esc(ST[view].q)}" onkeydown="if(event.key==='Enter')setSt('${view}','q',this.value)">`;
const pager = (view, total, size = 50) => { const o = ST[view].offset; return `<span class="muted">${total ? `${n(o + 1, 0)}–${n(Math.min(total, o + size), 0)} of ${n(total, 0)}` : '0'}</span>
  <button ${o ? '' : 'disabled'} onclick="ST.${view}.offset=Math.max(0,ST.${view}.offset-${size});render()">◀</button><button ${o + size < total ? '' : 'disabled'} onclick="ST.${view}.offset+=${size};render()">▶</button>`; };
const setStatus = (w, now, ai) => {
  const fresh = w && now - w.ts < 10 * 60e3;
  $('statusDot').className = 'dot ' + (w ? (fresh ? 'ok' : 'bad') : '');
  $('status').textContent = `worker ${w ? ago(now - w.ts) + ' ago' : 'not seen'} · AI ${ai.enabled ? (ai.ok === false ? 'error' : ai.model) : 'off'}`;
};
const aiBanner = (ai) => (!ai.enabled ? '<div class="card warn">NEAR AI is off (set NEAR_AI_API_KEY). Groups get rule-based verdicts only.</div>' : ai.ok === false ? `<div class="card err">NEAR AI error: ${esc(ai.error || '')}</div>` : '');
const views = {};

// ================================================================== EXPLORE
const ASSESS = { bullish: ['g', 'Winners in'], warning: ['r', 'Loss wallets in'], mixed: ['a', 'Mixed money'] };
const rugKind = { round_trip: 'round trip', price_crash: 'price crash', creator_dump: 'creator dump', flagged: 'dev rug (blacklist)' };
/** The creator sold (most of) their dev buy within the first hour: a warning, not a rug by itself. */
const exitChip = (o) => { const x = o?.creator_exit; return x && x.share >= 0.8 ? `<span class="v neutral" title="sold ${n(x.sold_near, 1)} N of a ${n(x.dev_buy_near, 1)} N dev buy within the first hour; first sale ${x.minutes} min after launch">creator exit · ${x.minutes} min</span>` : ''; };
const rugChips = (o) => (o?.rugged ? (o.rug_kinds?.length ? o.rug_kinds : ['rug']).map((k) => `<span class="v bad" title="${esc(o.rug_reason || 'rugged')}">${esc(rugKind[k] || 'rug')}</span>`).join(' ') : '');
const outcomeTxt = (o) => (o ? (o.rugged ? '<span class="r">RUG</span> ' : '') + `<span class="${roiCls((o.last_multiple ?? 1) - 1)}">x${n(o.last_multiple, 1)}</span>` : '–');
const signalCard = (s) => `<div class="tcard" ${row(P.tok(s.token))}>
  <div class="tc-top">${tokCell(s.token, s.symbol, s.launchpad, 22)}<span class="badge ${ASSESS[s.assessment][0]}">${ASSESS[s.assessment][1]}</span></div>
  ${mixBar(s.mix)}
  <div class="tc-stats"><span><small>Early</small><b>${s.early_wallets}w · ${n(s.total_near, 0)} N</b></span><span><small>Winners</small><b class="g">${pct(s.win_share)}</b></span><span><small>Loss</small><b class="r">${pct(s.loss_share)}</b></span><span><small>Now</small><b>${outcomeTxt(s.outcome)}</b></span></div>
  <div class="tc-groups">${s.groups.slice(0, 4).map(gchip).join('')}</div>
  <div class="muted small">${esc(s.launchpad)} · live ${since(s.live_ts)}</div></div>`;
const groupMini = (rows, empty_) => `<table><tr><th>Group</th><th>Tag</th><th class="num">Wallets</th><th class="num">Tokens</th><th class="num">Profitable</th><th class="num">Rug</th><th class="num">P&amp;L N</th></tr>
  ${rows.map((c) => `<tr ${row(P.grp(c.id))}><td><span class="ent">${avatar(c.id, c.ai?.label || c.id, 26)}<span><b>${ilink(P.grp(c.id), esc(short(c.ai?.label || (c.rule?.tags || [])[0] || c.id, 30)))}</b><small class="acct">${esc(short(c.id, 22))}</small></span></span></td>
    <td>${tg(c.tag)}</td><td class="num">${c.size}</td><td class="num">${c.metrics?.tokens_n ?? '–'}</td><td class="num">${pct(c.metrics?.profit_rate)}</td><td class="num">${pct(c.metrics?.rug_share)}</td><td class="num ${roiCls(c.metrics?.pnl_near)}">${signed(c.metrics?.pnl_near)}</td></tr>`).join('') || empty(7, empty_)}</table>`;

views.explore = async () => {
  const [o, s] = await Promise.all([get('/api/overview'), get('/api/signals', { hours: 72 })]);
  setStatus(o.worker, o.now, o.ai);
  const cv = Object.fromEntries(o.clusterTag.map((x) => [x.tag, x]));
  const gt = (v, l, c) => tile(l, n(cv[v]?.n || 0, 0), `${n(cv[v]?.wallets || 0, 0)} wallets`, c);
  return `<div class="hero"><h1>Know who is behind every NEAR launch</h1>
    <p class="muted">Safe Near follows the early money and the creators on NEAR launchpads: which wallet groups bought a token in its first minutes, how those wallets are connected, whether the token's creator has rugged before, and how it all turned out.</p>
    ${searchBox('heroSearch', 'big')}
    <div class="tiles">${tile('Tokens tracked', n(o.tokens, 0))}${tile('Early wallets', n(o.wallets, 0), `${n(o.profiled, 0)} profiled · ${n(o.entries, 0)} entries`)}${gt('win80', 'win80 groups', 'g')}${gt('win50', 'win50 groups', 'g')}${gt('win30', 'win30 groups', 'a')}${gt('loss', 'loss groups', 'r')}${tile('Rugged tokens', n(o.rugged, 0), `of ${n(o.tokens, 0)} tracked`, o.rugged ? 'r' : '')}${tile('Blacklisted creators', n(o.blacklisted, 0), `${n(o.groupsWithCreators, 0)} groups contain a rugger`, o.blacklisted ? 'r' : '')}${tile('Linked wallets (3 hops)', n(o.netWallets, 0), 'profiled around the groups')}</div></div>
  ${aiBanner(o.ai)}
  <div class="card"><div class="head"><h2>Tokens with known groups among the early buyers <span class="muted">last 72 h</span></h2>${ilink('/signals', 'All signals →')}</div>
    <div class="tokgrid">${s.rows.slice(0, 9).map(signalCard).join('') || '<p class="muted">No signals yet: needs profiled wallets and evaluated groups.</p>'}</div>
    <div class="legend">${MIXV.map(([v, l]) => `<span><span class="lg-dot ${v}"></span>${l}</span>`).join('')}<span>bar = share of early NEAR</span></div></div>
  <div class="grid2"><div class="card"><div class="head"><h2>Best groups <span class="muted">win80 / win50</span></h2>${ilink('/groups', 'All groups →')}</div>${groupMini(o.topWin, 'no win80 / win50 groups yet')}</div>
    <div class="card"><div class="head"><h2>Largest loss groups</h2>${ilink('/groups', 'All groups →')}</div>${groupMini(o.topLoss, 'no loss groups yet')}</div></div>
  <div class="card"><div class="head"><h2>Latest launches</h2>${ilink('/tokens', 'Tokens &amp; scanner →')}</div><table><tr><th>Token</th><th>Pad</th><th>Live</th><th>Status</th><th class="num">Early</th><th class="num">Peak</th><th>Rug</th></tr>
    ${o.latest.map((t) => `<tr ${row(P.tok(t.id))}><td>${tokCell(t.id, t.symbol, t.launchpad)}</td><td>${esc(t.launchpad)}</td><td>${since(t.live_ts)}</td><td><span class="chip">${esc(t.status)}</span></td><td class="num">${t.entries_n ?? '–'}</td><td class="num">x${n(t.outcome?.peak_multiple, 1)}</td><td class="${t.outcome?.rugged ? 'r' : 'muted'}">${t.outcome?.rugged ? 'RUG' : '–'}</td></tr>`).join('') || empty(7, 'no launches yet')}</table></div>`;
};

// ================================================================== TOKENS + SCANNER (one page)
/** Scanner state of a launch: observing / checking / gates fail / pass / bought (simulated). */
const scanState = (t, scanCfg) => {
  if (t.status === 'skipped_quote') return '<span class="muted">skipped (quote not tradable)</span>';
  if (t.status === 'awaiting_pool') return '<span class="muted">waiting for its pool</span>';
  if (t.track_only) return '<span class="chip">tracking only</span>';
  const s = t.scan;
  if (s?.stale) return '<span class="muted">stale</span>';
  if (s?.error) return '<span class="r">error</span>';
  if (s?.score != null) return s.bought ? '<span class="v good">bought (sim)</span>' : s.pass ? '<span class="v neutral">pass, no buy</span>' : '<span class="v bad">gates fail</span>';
  const minAge = Math.max(scanCfg.observeSeconds, t.launchpad === 'justhoot' ? scanCfg.justhootMinAgeSeconds : 0) * 1000;
  const left = minAge - (Date.now() - t.live_ts);
  return left > 0 ? `<span class="b">observing, check in ${ago(left)}</span>` : '<span class="b">checking…</span>';
};
views.tokens = async () => {
  const S = ST.tokens;
  const [j, m] = await Promise.all([get('/api/tokens', { q: S.q, status: S.status, tab: S.tab, launchpad: S.launchpad, limit: 50, offset: S.offset }), get('/api/monitor')]);
  setStatus(m.worker, m.now, m.ai);
  const W = m.window24h;
  return `<div class="card"><div class="tiles">${tile('Tokens tracked', n(m.tokensTotal, 0), `${m.launchesLast3h} in the last 3 h`)}${tile('Launches (24 h)', W.launches)}${tile('Checked', W.scanned, 'first check ' + m.scan.observeSeconds + 's after the pool opens')}${tile('Passed the gates', W.passed, null, 'a')}${tile('Bought (simulated)', W.bought, null, 'g')}${tile('Rugged tokens', n(m.ruggedTotal, 0), null, m.ruggedTotal ? 'r' : '')}
    ${m.polls.map((p) => tile(esc(p.launchpad), p.ts ? ago(m.now - p.ts) + ' ago' : '–', p.ok === false ? esc(short(p.error || 'failed', 30)) : 'last poll ok', p.ok === false ? 'r' : '')).join('')}</div></div>
  <div class="card"><div class="bar">${seg('tokens', 'tab', [['', 'All'], ['new', 'New (24 h)'], ['checked', 'Checked'], ['passed', 'Passed gates'], ['bought', 'Bought (sim)'], ['rugged', 'Rugged']])}
    ${qbox('tokens', 'symbol / token / creator')}
    ${sel('tokens', 'launchpad', [['', 'all launchpads'], ['nearlytrade', 'nearly.trade'], ['justhoot', 'justhoot'], ['memecooking', 'meme.cooking'], ['gaypad', 'gaypad'], ['tkn', 'tkn.near'], ['qlyphs', 'qlyphs']])}

/** A token we have never seen: fetch it from chain (launch, trades, early buyers, audit, analysis) and show the progress. */
function fetchPage(id) {
  setTimeout(() => startFetch(id), 0);
  return `<div class="card">${crumbs([['Tokens', '/tokens'], [short(id, 40)]])}<h2>${esc(id)}</h2>
    <p class="muted">This token is not in the database yet. Fetching it from the chain: its launch, trades and early buyers, the contract audit and the analysis.</p>
    <p id="fetchState"><span class="b">starting…</span></p></div>`;
}
let fetchTimer = null;
async function startFetch(id) {
  const box = () => document.getElementById('fetchState');
  if (!box()) return;
  clearTimeout(fetchTimer);
  const show = (html) => { if (box()) box().innerHTML = html; };
  try {
    let j = await get('/api/fetch-token', { id });
    const poll = async () => {
      if (location.pathname !== P.tok(id) && decodeURIComponent(location.pathname) !== P.tok(id)) return; // the user went elsewhere
      if (j.error) { show(`<span class="r">${esc(j.error)}</span>`); return; }
      if (j.state === 'running') { show(`<span class="b">${esc(j.step || 'working')}…</span>`); fetchTimer = setTimeout(async () => { j = await get('/api/fetch-status', { id }).catch(() => j); if (j.exists && (j.state !== 'running' || /auditing|analysis/.test(j.step || ''))) render(); else poll(); }, 2500); return; }
      if (j.state === 'error') { show(`<span class="r">Could not fetch it: ${esc(j.message || 'unknown error')}</span> <button onclick="startFetch('${esc(id)}')">Try again</button>`); return; }
      if (j.exists) { render(); return; }
      show(`<span class="muted">${esc(j.message || 'Nothing was stored.')}</span>`);
    };
    await poll();
  } catch (e) { show(`<span class="r">${esc(e.message)}</span>`); }
}

/** When the token's data was last synced and when it is next; "Sync now" reads it from the chain right away and re-runs the analysis. */
function syncBanner(t) {
  const due = t.next_process_ts != null && t.next_process_ts <= Date.now();
  let txt, cls = 'unrated';
  if (t.status === 'awaiting_pool') txt = 'Waiting for its pool: checked again every 10 minutes.';
  else if (t.status === 'skipped_quote') txt = 'Not synced: its pool is quoted in a token that cannot be valued in NEAR.';
  else if (!t.processed_ts) { txt = 'Not synced yet: queued for its first sync (the newest launches go first). Trades and early buyers appear after it.'; cls = 'win30'; }
  else if (t.status === 'done') txt = `Fully synced (24 h of history) · last ${since(t.processed_ts)}`;
  else txt = `Last synced ${since(t.processed_ts)} · next sync ${due ? 'due now' : 'in ' + ago(t.next_process_ts - Date.now())}${t.status === 'entries_open' ? ' · early window open, synced every minute' : ''}`;
  return `<div class="banner"><span class="v ${cls}">sync</span><div style="flex:1;min-width:0"><span class="small">${esc(txt)}</span><div id="fetchState" class="small"></div></div>${t.status === 'awaiting_pool' || t.status === 'skipped_quote' ? '' : `<button onclick="startFetch('${esc(t.id)}')">Sync now</button>`}</div>`;
}

/** Bubble map: one bubble per early buyer (area ~ NEAR in), packed inside one circle per group, groups packed around the biggest. */
function bubbleMap(entries) {
  if (!entries.length) return '<p class="muted">no early buyers recorded</p>';
  const buckets = new Map();
  for (const e of entries) { const k = e.cluster ? e.cluster.id : ''; const b = buckets.get(k) || { key: k, c: e.cluster, items: [], near: 0 }; b.items.push(e); b.near += e.buy_near || 0; buckets.set(k, b); }
  const maxN = Math.max(...entries.map((e) => e.buy_near || 0), 0.01);
  const pack = (cs, gap) => { // greedy: biggest first, each next one at the first free spot on an outward spiral
    const done = [];
    for (const c of cs) {
      if (!done.length) { c.x = 0; c.y = 0; done.push(c); continue; }
      for (let a = 0; ; a += 0.2) { const d = 0.9 * a, x = d * Math.cos(a), y = d * Math.sin(a); if (done.every((p) => Math.hypot(p.x - x, p.y - y) >= p.r + c.r + gap)) { c.x = x; c.y = y; break; } }
      done.push(c);
    }
    return done;
  };
  const groups = [...buckets.values()].sort((a, b) => b.near - a.near).map((b) => {
    const cs = pack(b.items.map((e) => ({ e, r: 4 + 18 * Math.sqrt((e.buy_near || 0) / maxN) })).sort((x, y) => y.r - x.r), 1.5);
    return { ...b, cs, r: Math.max(...cs.map((c) => Math.hypot(c.x, c.y) + c.r)) + 7 };
  });
  pack(groups, 30);
  const x0 = Math.min(...groups.map((g) => g.x - g.r)) - 6, x1 = Math.max(...groups.map((g) => g.x + g.r)) + 6;
  const y0 = Math.min(...groups.map((g) => g.y - g.r)) - 20, y1 = Math.max(...groups.map((g) => g.y + g.r)) + 6;
  const W = Math.max(x1 - x0, 320), fs = Math.max(9, W / 85);
  const svg = groups.map((g) => {
    const v = g.c ? tagOk(g.c.tag) : 'solo', col = VCOL[v];
    const label = g.c ? `${short(g.c.label || g.c.id, 24)} · ${g.items.length}` : `unlinked · ${g.items.length}`;
    const ring = `<circle cx="${g.x}" cy="${g.y}" r="${g.r}" style="fill:${col};fill-opacity:.07;stroke:${col};stroke-opacity:.55" stroke-width="1.2" ${g.c ? '' : 'stroke-dasharray="4 4"'}/>`;
    const lbl = `<text x="${g.x}" y="${g.y - g.r - 5}" text-anchor="middle" font-size="${fs}" style="fill:var(--muted)" font-weight="600">${esc(label)}</text>`;
    const dots = g.cs.map((c) => `<a href="${esc(P.wal(c.e.wallet))}" onclick="return navA(event,this)"><circle cx="${g.x + c.x}" cy="${g.y + c.y}" r="${c.r}" style="fill:${VCOL[tagOk(c.e.tag)]}" fill-opacity="${g.c ? 0.85 : 0.9}" ${c.e.is_creator ? 'stroke="var(--bad)" stroke-width="2.5"' : ''}><title>${esc(c.e.wallet)}\n${n(c.e.buy_near, 2)} N in · rank #${c.e.rank} · ${c.e.delay_s}s after open\nROI now ${pct(c.e.roi_now)}\n${esc(tagOk(c.e.tag))}${g.c ? ' - group ' + esc(g.c.label || g.c.id) : ''}${c.e.is_creator ? '\nCREATOR' : ''}</title></circle></a>`).join('');
    return (g.c ? `<a href="${esc(P.grp(g.c.id))}" onclick="return navA(event,this)">${ring}${lbl}</a>` : ring + lbl) + dots;
  }).join('');
  return `<svg class="bubbles" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
}

// Layered picture: funders on top, member wallets in the middle, destinations of NEAR at the bottom.
function graphSvg(g) {
  if (!g.nodes?.length) return '<p class="muted">no graph data</p>';
  const nodes = new Map(g.nodes.map((x) => [x.id, { ...x, level: x.member ? 0 : null }]));
  const fund = g.edges.filter((e) => e.type === 'fund'), flow = g.edges.filter((e) => e.type === 'flow');
  // funders: one level above whoever they fund
  for (let pass = 0; pass < 6; pass++) for (const e of fund) { const c = nodes.get(e.to), f = nodes.get(e.from); if (c && f && c.level != null && (f.level == null || f.level > c.level - 1)) f.level = c.level - 1; }
  for (const e of flow) { const d = nodes.get(e.to); if (d && d.level == null) d.level = 1; }
  for (const x of nodes.values()) if (x.level == null) x.level = -1;
  const levels = [...new Set([...nodes.values()].map((x) => x.level))].sort((a, b) => a - b);
  const W = 1000, rowH = 110, H = levels.length * rowH + 30;
  const pos = new Map();
  levels.forEach((lv, li) => { const r = [...nodes.values()].filter((x) => x.level === lv); r.forEach((x, i) => pos.set(x.id, { x: 20 + ((i + 0.5) * (W - 40)) / r.length, y: 30 + li * rowH })); });
  const color = (x) => (x.member ? 'var(--accent)' : x.kind === 'wallet' || x.kind == null ? 'var(--neutral)' : 'var(--unknown)');
  const edgeSvg = g.edges.map((e) => { const a = pos.get(e.from), b = pos.get(e.to); if (!a || !b) return ''; const col = e.type === 'fund' ? 'var(--good)' : 'var(--bad)';
    return `<path d="M${a.x},${a.y} C${a.x},${(a.y + b.y) / 2} ${b.x},${(a.y + b.y) / 2} ${b.x},${b.y}" fill="none" style="stroke:${col}" stroke-opacity=".5" stroke-width="${Math.min(3, 0.6 + Math.log10(1 + (e.near || 0)))}"><title>${esc(e.type)} ${esc(short(e.from, 20))} → ${esc(short(e.to, 20))} ${n(e.near, 2)} N</title></path>`; }).join('');
  const nodeSvg = [...nodes.values()].map((x) => { const p = pos.get(x.id), href = x.member ? P.wal(x.id) : P.ent(x.id);
    return `<a href="${esc(href)}" onclick="return navA(event,this)"><g><circle cx="${p.x}" cy="${p.y}" r="${x.member ? 7 : 5}" style="fill:${color(x)}"><title>${esc(x.id)}${x.kind ? ' · ' + esc(x.kind) : ''}${x.tx_count != null ? ' · ' + x.tx_count + ' txs' : ''}</title></circle>${nodes.size <= 40 ? `<text x="${p.x}" y="${p.y + 18}" style="fill:var(--muted)" font-size="9" text-anchor="middle">${esc(short(x.id, 14))}</text>` : ''}</g></a>`; }).join('');
  return `<svg class="graph" viewBox="0 0 ${W} ${H}">${edgeSvg}${nodeSvg}</svg>`;
}

// ================================================================== SCANNER
const LV = { low: 'good', medium: 'neutral', high: 'bad', critical: 'bad', unrated: 'unknown', high_trust: 'good' };
const CAT = { critical: 'Critical', ownership: 'Ownership & control', trading: 'Trading', liquidity: 'Liquidity', trust: 'Trust signals' };
const gauge = (label, score, level, kind) => {
  const v = score ?? 0, col = kind === 'risk' ? (v >= 70 ? '#dc2626' : v >= 45 ? '#ea580c' : v >= 20 ? '#d97706' : '#16a34a') : (v >= 70 ? '#16a34a' : v >= 40 ? '#0ea5e9' : v >= 15 ? '#d97706' : '#94a3b8');
  return `<div class="tile"><span>${label}</span><b style="color:${col}">${score ?? '–'}<span class="muted" style="font-size:13px;font-weight:500"> / 100 · ${esc(level || '–')}</span></b><div style="height:6px;border-radius:5px;background:var(--line-2);margin-top:8px;overflow:hidden"><div style="height:100%;width:${v}%;background:${col}"></div></div></div>`;
};
function auditBody(a) {
  if (a.error) return `<div class="card err">${esc(a.error)}</div>`;
  if (a.notFound) return `<div class="card warn">${esc(a.address)}: there is no contract deployed on this account (a plain wallet), nothing to audit.</div>`;
  const sum = a.summary || {};
  let h = `<div class="card"><div class="bar"><h2 style="margin:0">${esc(a.address)}${a.tokenSymbol ? ' · ' + esc(a.tokenSymbol) : ''} <span class="chip">${esc(a.kind)}</span></h2><span class="muted">audited ${when(a.fetchedAt)}${a.cached ? ' (cached ≤ 1 h)' : ''}</span>${a.kind === 'token' ? ilink(P.tok(a.address), 'Token page →') : ''}<span class="spacer"></span><button onclick="runAudit('${esc(a.address)}',true)">Re-run</button></div>
    <div class="tiles">${gauge('Risk score (higher = riskier)', a.risk.score, a.risk.level, 'risk')}${gauge('Trust score', a.trust.score, a.trust.level, 'trust')}
    ${tile('Full-access keys', sum.full_access_keys ?? '–')}${tile('Confirmed malicious findings', (sum.confirmed_malicious || []).length, null, (sum.confirmed_malicious || []).length ? 'r' : 'g')}${tile('Recent sells', sum.sells ? sum.sells.ok + ' ok / ' + sum.sells.failed + ' failed' : '–')}</div>`;
  if ((sum.confirmed_malicious || []).length) h += `<p class="r"><b>Confirmed:</b> ${sum.confirmed_malicious.map((c) => esc(c.key) + (c.detail ? ' (' + esc(c.detail) + ')' : '')).join(' · ')}</p>`;
  h += '</div>';
  const all = [...a.risk.factors, ...a.trust.factors.filter((f) => !a.risk.factors.some((x) => x.key === f.key))];
  const groups = {};
  for (const f of all) (groups[f.category] ||= []).push(f);
  h += '<div class="card"><h2>Checklist <span class="muted">every criterion that was evaluated, not only the ones that tripped</span></h2><table><tr><th>Result</th><th>Check</th><th class="num">Weight</th><th>Detail</th></tr>' +
    ['critical', 'ownership', 'trading', 'liquidity', 'trust'].filter((c) => groups[c]).map((c) => `<tr><td colspan="4" style="background:var(--panel-2);font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.7px;text-transform:uppercase">${CAT[c]}</td></tr>` + groups[c].map((f) => `<tr><td>${f.category === 'trust' ? (f.hit ? '<span class="v good">earned</span>' : '<span class="v unknown">not earned</span>') : f.hit ? (f.weight > 0 ? '<span class="v bad">hit</span>' : '<span class="v unknown">note</span>') : '<span class="v good">pass</span>'}</td><td class="wrap">${esc(f.label)}</td><td class="num ${f.hit && f.weight > 0 ? 'r' : 'muted'}">${f.weight > 0 ? '+' : ''}${f.weight}</td><td class="wrap muted">${esc(f.detail || '')}</td></tr>`).join('')).join('') + '</table></div>';
  const code = a.raw?.code;
  if (code) h += `<div class="card"><h2>Code <span class="muted">${code.exports.length} exported functions</span></h2>${code.fakeStorage.length ? `<p class="r">Fake storage methods: ${code.fakeStorage.map(esc).join(', ')}</p>` : ''}${(code.privilegedNames || []).length ? `<p class="a">Privileged methods: ${code.privilegedNames.map(esc).join(', ')}</p>` : ''}${code.nonStandard.length ? `<p>Non-standard methods: ${code.nonStandard.map(esc).join(', ')}</p>` : '<p class="muted">No methods outside the standards.</p>'}</div>`;
  if (a.raw?.tax) h += `<div class="card"><h2>Launchpad tax</h2><pre>${esc(JSON.stringify(a.raw.tax, null, 1))}</pre></div>`;
  return h;
}

const lineSvg = (pts, { fmt = (v) => n(v, 2), base = null } = {}) => {
  if (pts.length < 2) return '<p class="muted">not enough data points yet (a point is stored every 5 minutes while the worker runs)</p>';
  const W = 1000, H = 120, xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), lo = Math.min(...ys, base ?? Infinity), hi = Math.max(...ys, base ?? -Infinity);
  const sx = (x) => 8 + ((x - x0) / (x1 - x0 || 1)) * (W - 16), sy = (y) => H - 10 - ((y - lo) / (hi - lo || 1)) * (H - 20);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
  const b = base != null ? `<line x1="0" x2="${W}" y1="${sy(base)}" y2="${sy(base)}" style="stroke:var(--faint)" stroke-dasharray="4 4"/>` : '';
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:120px">${b}<path d="${d}L${sx(x1)},${H}L${sx(x0)},${H}Z" style="fill:var(--accent-soft)"/><path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg><div class="muted small" style="display:flex;justify-content:space-between;margin-top:4px"><span>${esc(when(x0))}</span><span>min ${fmt(lo)} · max ${fmt(hi)}</span><span>${esc(when(x1))}</span></div>`;
};

  const s = await get('/api/scan', { id }), f = s.features || {}, ai = s.ai;
  let h = `<div class="card">${crumbs([['Evaluations', '/scans'], [`${s.symbol || short(s.token, 20)} · ${s.kind}`]])}
    <div class="dh-main">${avatar(s.token, s.symbol, 48)}<div><h1>${esc(s.symbol || '')} · ${esc(s.kind)}${s.kind === 'followup' ? ' +' + s.minutes + ' min' : ''} ${s.pass ? '<span class="v good">gates pass</span>' : '<span class="v bad">gates fail</span>'}</h1>
    <div class="meta">${ilink(P.tok(s.token), 'Token page →')}${ext(tokUrl(s.token, s.launchpad), 'Launchpad ↗')}<span>${when(s.ts)}</span><span>score <b class="b">${s.score}</b></span><span>${esc(s.decision || '')}</span></div></div></div>`;
  if (s.trade) h += `<p>Simulated trade: <b class="${s.trade.status === 'bought' ? 'g' : ''}">${esc(s.trade.status)}</b> ${s.trade.near ? s.trade.near + ' N' : ''} ${esc(s.trade.reason || '')}</p>`;
  if ((s.failed || []).length) h += '<h3>Failed gates</h3><ul class="flags">' + s.failed.map((g) => `<li><span class="r">${esc(g.id)}</span> ${esc(g.why)}</li>`).join('') + '</ul>';
  h += '</div>';
  if (ai) h += `<div class="ai"><b>NEAR AI analyst</b> · ${esc(ai.action)} confidence ${n(ai.confidence)} · risk ${esc(ai.risk_level)} · quality ${ai.quality_score ?? '–'} <span class="muted">(${esc(ai.model)})</span>${(ai.reasons || []).length ? '<ul class="flags">' + ai.reasons.map((x) => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}${(ai.red_flags || []).length ? '<p class="a"><b>Red flags</b></p><ul class="flags">' + ai.red_flags.map((x) => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}</div>`;
  else h += '<div class="card muted">No AI review (the gates failed, NEAR_AI_API_KEY is not set, or the call failed).</div>';
  const ig = f.intel?.early_buyer_groups;

    h += `<div class="card"><h2>Entity intelligence <span class="muted">early buying by group verdict at the time of the check</span></h2><p class="small"><span class="g">good ${pct(ig.good.share)} (${ig.good.wallets} w)</span> · <span class="r">dangerous ${pct(ig.bad.share)} (${ig.bad.wallets} w)</span> · bots/losers ${pct(ig.bots_losers?.share)} · neutral ${pct(ig.neutral.share)} · unknown ${pct(ig.unknown.share)} · creator's earlier rugs: ${f.intel.creator_prior_rugs_or_dumps}/${f.intel.creator_prior_launches}</p></div>`;
  }
  h += `<div class="grid2"><div class="card"><h2>Key numbers</h2><table class="kv">${[['Pool', n(f.pool?.nearReserve, 1) + ' N · ' + (f.pool?.quoteSymbol || '') + ' · ' + (f.pool?.route || '')], ['Market cap', '$' + n(f.market?.mcapUsd, 0)], ['Buyers / sellers', `${f.trading?.uniqueBuyers} / ${f.trading?.uniqueSellers}`], ['Bought / sold', `${n(f.trading?.buyNear, 0)} / ${n(f.trading?.sellNear, 0)} N`], ['Price vs first trade', 'x' + f.trading?.priceMultipleSinceFirstTrade], ['Linked buyer share', pct(f.wallets?.linkedBuyerShare)], ['Creator sold', f.trading?.creatorSold ? 'yes' : 'no'], ['Tax', JSON.stringify(f.launch?.tax)], ['Contract matches template', String(f.contract?.matchesTemplate)], ['Top-10 holders', pct(f.holders?.top10ShareExPool, 1)]].map(([k, v]) => `<tr><td>${k}</td><td class="wrap">${esc(v)}</td></tr>`).join('')}</table></div>
    <div class="card"><h2>All features</h2><pre style="white-space:pre-wrap;color:var(--muted);max-height:520px">${esc(JSON.stringify(f, null, 1))}</pre></div></div>`;
  return h;
}

  h += `<div class="card"><h2>Tokens launched <span class="muted">${c.tokens.length}</span></h2><table><tr><th>Token</th><th>Live</th><th class="num">Peak</th><th class="num">Now</th><th>Rug</th><th>Creator sold</th></tr>

// ================================================================== search
const SEARCH_ICON = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
function searchBox(id, cls = '') {
  return `<div class="search ${cls}">${SEARCH_ICON}<input id="${id}" type="search" autocomplete="off" spellcheck="false" placeholder="Search a token, wallet or group…  ( / )" oninput="searchInput(this)" onfocus="searchInput(this)" onkeydown="searchKey(event,this)"><div class="sr" id="${id}-r"></div></div>`;
}
let sTimer = null, sSeq = 0;
function searchInput(el) {
  clearTimeout(sTimer);
  const q = el.value.trim(), box = $(el.id + '-r');
  if (q.length < 2) { box.classList.remove('open'); return; }
  sTimer = setTimeout(async () => {
    const my = ++sSeq, r = await get('/api/search', { q }).catch(() => null);
    if (!r || my !== sSeq) return;
    box.innerHTML = searchHtml(r, q); box.classList.add('open');
  }, 200);
}
function searchHtml(r, q) {
  const sec = (title, items) => (items.length ? `<div class="sr-h">${title}</div>${items.join('')}` : '');
  const item = (path, icon, main, sub) => `<a class="sr-i" href="${esc(path)}" onmousedown="event.preventDefault()" onclick="closeSearch();return navA(event,this)">${icon}<span><b>${main}</b><small>${sub}</small></span></a>`;
  let h = sec('Tokens', r.tokens.map((t) => item(P.tok(t.id), avatar(t.id, t.symbol, 28), esc(t.symbol || short(t.id, 20)), `<span class="acct">${esc(short(t.id, 36))}</span> · ${esc(t.launchpad)} · ${since(t.live_ts)}${t.outcome?.rugged ? ' · <span class="r">rug</span>' : ''}`)))
    + sec('Wallets', r.wallets.map((w) => item(P.wal(w.id), avatar(w.id, w.id, 28), `<span class="acct">${esc(short(w.id, 40))}</span>`, `${tg(w.tag)} ${w.cluster_id ? 'group ' + esc(short(w.cluster_id, 18)) : 'unlinked'} · ${w.stats?.tokens_n ?? 0} tokens`)))
    + sec('Groups', r.groups.map((c) => item(P.grp(c.id), avatar(c.id, c.ai?.label || c.id, 28), esc(c.ai?.label || c.id), `${tg(c.tag)} ${c.size} wallets · <span class="acct">${esc(short(c.id, 22))}</span>`)));
  if (ACCT_RE.test(q) && q.includes('.')) h += sec('Contract', [item(P.audit(q), '<span class="av" style="--h:170;width:28px;height:28px;font-size:11px">⛨</span>', 'Audit ' + esc(q), 'access keys, code, tax, sell behaviour')].concat(r.tokens.some((t) => t.id === q) ? [] : [item(P.tok(q), avatar(q, q, 28), 'Fetch & analyse ' + esc(short(q, 34)), 'not in the database: read its launch, trades and early buyers from the chain')]));
  return h || `<div class="sr-empty">Nothing found for “${esc(q)}”.</div>`;
}
function searchKey(e, el) {
  const box = $(el.id + '-r'), items = [...box.querySelectorAll('a.sr-i')], i = items.findIndex((a) => a.classList.contains('on'));
  if (e.key === 'Escape') { closeSearch(); el.blur(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return; items.forEach((a) => a.classList.remove('on')); const j = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1); items[j].classList.add('on'); items[j].scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { const a = items[Math.max(0, i)]; if (a && box.classList.contains('open')) { closeSearch(); el.blur(); nav(null, a.getAttribute('href')); } }
}
function closeSearch() { clearTimeout(sTimer); document.querySelectorAll('.sr.open').forEach((x) => x.classList.remove('open')); }
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) closeSearch(); });
document.addEventListener('keydown', (e) => { if (e.key === '/' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) { e.preventDefault(); $('topQ').focus(); } });

// ================================================================== shell + router (History API: /tokens/<id>, /groups/<id>, no #)
const SECTIONS = [
  { label: 'Explore', views: [['explore', 'Explore']] },
  { label: 'Tokens & Scanner', views: [['tokens', 'Launches'], ['signals', 'Smart-money signals'], ['sim', 'Simulated wallet'], ['scans', 'Evaluations'], ['audit', 'Contract audit']] },
  { label: 'Wallets & Groups', views: [['groups', 'Groups'], ['wallets', 'Wallets'], ['creators', 'Creators'], ['entities', 'Funders & entities']] },
];
const TITLES = {
  explore: ['Explore', ''], tokens: ['Tokens & Scanner', "Every launch: who bought it early (by win-rate tag), the scanner's first check and gates, its outcome and whether it was rugged"],
  signals: ['Smart-money signals', 'Recent tokens where winners (win80 / win50) or loss wallets were among the early buyers'],
  groups: ['Groups', 'Wallets linked by funding, money flow, co-buying and up to 3 hops of shared accounts, tagged by how often their early buys ended in profit'],
  creators: ['Creators', 'Who launched the tokens: launches, rugged launches and the dev-rug blacklist, and which groups they belong to'],
  wallets: ['Wallets', 'Every early buyer: its group, who funded it and how it did'], entities: ['Funders & entities', 'Exchange wallets, services, funders and destinations around the early investors'],
  sim: ['Simulated wallet', 'Paper trading with real pool quotes: equity, open and closed positions'],
  scans: ['Evaluations', 'Every gate check and AI review, with the reasons'], audit: ['Contract audit', 'Access keys, code, tax and sell behaviour of any NEAR token or contract, scored for risk and trust'],
  logs: ['Log', 'Worker activity'], config: ['Settings', 'Read-only view of the configuration in use'],
};
const DETAIL = { creators: creatorPage, tokens: tokenPage, wallets: walletPage, groups: groupPage, entities: entityPage, scans: scanPage, sim: simPage };
function setUrl(path) { if (location.pathname !== path) history.pushState(null, '', path); }
/** Link / tab click: change the path without reloading the page. */
function nav(e, path) {
  if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.button)) return true; // let "open in new tab" work
  if (e) e.preventDefault();
  setUrl(path); window.scrollTo(0, 0); render();
  return false;
}
const navA = (e, a) => nav(e, a.getAttribute('href'));
function rowNav(e, el) {
  if (!el.dataset.href || e.target.closest('a,button,input,select')) return;
  if (e.metaKey || e.ctrlKey) { window.open(el.dataset.href, '_blank'); return; }
  nav(null, el.dataset.href);
}
function toggleTheme() { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {} }
let seq = 0;
async function render() {
  closeSearch();
  const seg = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  let view = seg[0] === 'overview' ? 'explore' : seg[0] === 'monitor' ? 'tokens' : seg[0]; // the old Monitor page is part of /tokens now
  if (!views[view]) view = 'explore';
  if (!seg.length || seg[0] === 'overview' || seg[0] === 'monitor') history.replaceState(null, '', '/' + view);
  const id = seg.length > 1 ? seg.slice(1).join('/') : null, detail = id && DETAIL[view];
  const sec = SECTIONS.find((s) => s.views.some(([v]) => v === view)) || { label: '', views: [[view, TITLES[view][0]]] };
  $('nav').innerHTML = SECTIONS.map((s) => `<a href="/${s.views[0][0]}" onclick="return navA(event,this)" class="${s === sec ? 'on' : ''}">${s.label}</a>`).join('');
  $('subnav').innerHTML = sec.views.map(([v, l]) => `<a href="/${v}" onclick="return navA(event,this)" class="${v === view ? 'on' : ''}">${l}</a>`).join('');
  $('subnav').hidden = sec.views.length < 2;
  $('pagehead').hidden = !!detail || view === 'explore';
  $('pageTitle').textContent = TITLES[view][0]; $('pageSub').textContent = TITLES[view][1];
  document.title = `${detail ? short(id, 30) : TITLES[view][0]} · Safe Near`;
  const my = ++seq;
  $('main').classList.add('loading');
  try {
    const html = detail ? await DETAIL[view](id) : await views[view]();
    if (my === seq) { $('main').innerHTML = html; if (view === 'audit' && id) runAudit(id); }
  } catch (e) { if (my === seq) $('main').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  if (my === seq) $('main').classList.remove('loading');
}
$('topSearch').outerHTML = searchBox('topQ');
const loadStatus = () => get('/api/monitor').then((m) => setStatus(m.worker, m.now, m.ai)).catch(() => {});
loadStatus(); setInterval(loadStatus, 60000);
window.addEventListener('popstate', render);
loadMemeIds().then(render);
setInterval(loadMemeIds, 600000);
// list pages refresh every 30 s; detail pages, open search results and focused inputs are left alone
setInterval(() => { if (location.pathname.split('/').filter(Boolean).length < 2 && !document.querySelector('.sr.open') && !['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) render(); }, 30000);
</script>
