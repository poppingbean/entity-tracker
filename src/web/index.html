<style>
  /* ---------- tokens: dark by default, light on demand ---------- */
  :root, :root[data-theme="dark"] {
    --bg:#090d13; --bg-2:#0d131b; --panel:#111821; --panel-2:#151e29; --hover:#18222f; --line:#212c3a; --line-2:#1a2330;

    --accent:#2dd4bf; --accent-2:#38bdf8; --accent-ink:#03201d; --accent-soft:rgba(45,212,191,.12); --accent-line:rgba(45,212,191,.35);
    --good:#22c55e; --bad:#f43f5e; --neutral:#f59e0b; --unknown:#64748b; --solo:#3b4a5e; --info:#38bdf8; --purple:#a78bfa;
    --good-soft:rgba(34,197,94,.13); --bad-soft:rgba(244,63,94,.13); --neutral-soft:rgba(245,158,11,.13); --unknown-soft:rgba(100,116,139,.18);
    --win80:#22c55e; --win50:#a3e635; --win30:#f59e0b; --sniper:#a78bfa; --loss:#f43f5e;

  }
  :root[data-theme="light"] {

    --text:#0f172a; --muted:#5b6b80; --faint:#94a3b8;
    --accent:#0d9488; --accent-2:#0284c7; --accent-ink:#ffffff; --accent-soft:rgba(13,148,136,.09); --accent-line:rgba(13,148,136,.35);
    --good:#16a34a; --bad:#e11d48; --neutral:#d97706; --unknown:#94a3b8; --solo:#cbd5e1; --info:#0284c7; --purple:#7c3aed;
    --good-soft:rgba(22,163,74,.10); --bad-soft:rgba(225,29,72,.09); --neutral-soft:rgba(217,119,6,.10); --unknown-soft:rgba(148,163,184,.16);
    --win80:#16a34a; --win50:#65a30d; --win30:#d97706; --sniper:#7c3aed; --loss:#e11d48;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06); color-scheme:light;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  code, pre, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  code { font-size:12px; background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:6px; padding:1px 6px; color:var(--accent); }
  pre { font-size:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; }
  .muted { color:var(--muted); } .small { font-size:12px; } .wrap { white-space:normal; }
  .g { color:var(--good); } .r { color:var(--bad); } .a { color:var(--neutral); } .b { color:var(--info); } .p { color:var(--purple); }

  /* ---------- top bar ---------- */
  .topbar { position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .topin { max-width:1440px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:18px; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--text); text-decoration:none !important; flex:0 0 auto; }
  .logo { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; color:var(--accent-ink); background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
  .brand b { font-size:15px; letter-spacing:.1px; } .brand small { display:block; color:var(--muted); font-size:11px; line-height:1.1; }
  #nav { display:flex; gap:2px; }

  #nav a:hover { color:var(--text); background:var(--hover); }
  #nav a.on { color:var(--text); background:var(--panel-2); box-shadow:inset 0 -2px 0 var(--accent); }
  .topbar .search { flex:1; max-width:440px; margin-left:auto; }
  .status { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--unknown); } .dot.ok { background:var(--good); box-shadow:0 0 0 3px var(--good-soft); } .dot.bad { background:var(--bad); box-shadow:0 0 0 3px var(--bad-soft); }
  .status:has(#status:empty) { display:none; }
  .icon-btn { background:transparent; border:1px solid var(--line); color:var(--muted); width:34px; height:34px; padding:0; display:grid; place-items:center; border-radius:9px; cursor:pointer; flex:0 0 auto; }
  .icon-btn:hover { color:var(--text); background:var(--hover); }

  #subnav { max-width:1440px; margin:0 auto; padding:0 24px; display:flex; gap:4px; overflow-x:auto; }
  #subnav a { padding:9px 12px 10px; color:var(--muted); font-weight:600; font-size:13px; border-bottom:2px solid transparent; white-space:nowrap; text-decoration:none; }
  #subnav a:hover { color:var(--text); } #subnav a.on { color:var(--accent); border-bottom-color:var(--accent); }
  #subnav[hidden] { display:none; }

  /* ---------- search ---------- */
  .search { position:relative; display:flex; align-items:center; }
  .search > svg { position:absolute; left:11px; color:var(--faint); pointer-events:none; }
  .search input { width:100%; padding:8px 12px 8px 34px; }
  .search.big input { font-size:15px; padding:13px 16px 13px 40px; border-radius:12px; }
  .search.big > svg { left:14px; width:18px; height:18px; }
  .sr { display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); max-height:70vh; overflow:auto; z-index:50; padding:6px; }
  .sr.open { display:block; }
  .sr-h { padding:8px 10px 4px; font-size:10.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--faint); }
  .sr-i { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; color:var(--text); text-decoration:none !important; }
  .sr-i:hover, .sr-i.on { background:var(--hover); }
  .sr-i b { display:block; font-weight:600; } .sr-i small { display:block; color:var(--muted); font-size:11.5px; }
  .sr-empty { padding:14px; color:var(--muted); }

  /* ---------- page ---------- */
  main { max-width:1440px; margin:0 auto; padding:20px 24px 56px; transition:opacity .15s; }
  main.loading { opacity:.5; }
  .pagehead { max-width:1440px; margin:0 auto; padding:22px 24px 0; }
  .pagehead h1 { margin:0; font-size:22px; letter-spacing:-.2px; } .pagehead p { margin:3px 0 0; color:var(--muted); font-size:13px; }
  .pagehead[hidden] { display:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; overflow-x:auto; }
  .card.warn { background:var(--neutral-soft); border-color:color-mix(in srgb, var(--neutral) 40%, transparent); }
  .card.err { background:var(--bad-soft); border-color:color-mix(in srgb, var(--bad) 40%, transparent); }
  h2 { font-size:15px; margin:0 0 14px; font-weight:650; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h2 .muted { font-weight:400; font-size:12.5px; }
  h3 { font-size:11px; margin:20px 0 8px; color:var(--muted); font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; } .head h2 { margin-bottom:14px; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; } .grid2 > .card { margin-bottom:16px; }
  .grid2.wide-l { grid-template-columns:minmax(0,5fr) minmax(0,7fr); }
  .crumbs { font-size:12.5px; color:var(--muted); margin-bottom:12px; } .crumbs a { color:var(--muted); } .crumbs a:hover { color:var(--accent); }

  /* ---------- hero ---------- */
  .hero { padding:30px 28px 24px; border-radius:18px; margin-bottom:16px; border:1px solid var(--line);
          background:radial-gradient(800px 260px at 10% -20%, var(--accent-soft), transparent 70%), radial-gradient(600px 240px at 100% 0%, rgba(56,189,248,.10), transparent 70%), var(--panel); }
  .hero h1 { margin:0 0 6px; font-size:28px; letter-spacing:-.4px; } .hero > p { margin:0 0 18px; max-width:720px; }
  .hero .search { max-width:720px; margin-bottom:22px; }

  /* ---------- tiles ---------- */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile { border:1px solid var(--line); border-radius:12px; padding:11px 14px; background:var(--panel-2); min-width:0; }
  .tile > span { font-size:11.5px; font-weight:600; color:var(--muted); }
  .tile b { display:block; font-size:20px; line-height:1.25; margin-top:2px; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile small { display:block; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- detail header ---------- */
  .dh-main { display:flex; gap:16px; align-items:flex-start; margin-bottom:16px; }
  .dh-main h1 { margin:0; font-size:24px; letter-spacing:-.3px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; word-break:break-all; }
  .dh-main h1 .muted { font-size:15px; font-weight:500; }
  /* call to action: the token's on-chain analysis */
  .watchbtn { padding:6px 12px; font-size:13px; } .watchbtn.on { color:var(--accent); border-color:var(--accent-line); }
  .cta-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:4px 0 18px; }
  .cta { display:inline-flex; align-items:center; gap:10px; padding:13px 22px; border-radius:12px; font-size:16px; font-weight:700; letter-spacing:.1px;
         color:var(--accent-ink); background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 8px 24px -8px var(--accent), 0 0 0 1px var(--accent-line);
         text-decoration:none; transition:transform .12s ease, box-shadow .12s ease, filter .12s ease; }
  .cta:hover { text-decoration:none; transform:translateY(-1px); filter:brightness(1.06); box-shadow:0 12px 28px -8px var(--accent), 0 0 0 1px var(--accent); }
  .cta:active { transform:translateY(0); }
  .cta svg { width:20px; height:20px; flex:none; }
  .cta-row .cta-note { color:var(--muted); font-size:13px; max-width:520px; }
  .meta { color:var(--muted); font-size:12.5px; margin-top:5px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
  .banner { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel-2); margin-bottom:14px; flex-wrap:wrap; }
  .banner.good { border-color:color-mix(in srgb, var(--good) 40%, transparent); background:var(--good-soft); }
  .banner.bad, .banner.loss { border-color:color-mix(in srgb, var(--bad) 40%, transparent); background:var(--bad-soft); }
  .banner.win80, .banner.win50 { border-color:color-mix(in srgb, var(--good) 40%, transparent); background:var(--good-soft); }
  .banner.win30 { border-color:color-mix(in srgb, var(--neutral) 40%, transparent); background:var(--neutral-soft); }
  .banner.neutral { border-color:color-mix(in srgb, var(--neutral) 40%, transparent); background:var(--neutral-soft); }

  /* ---------- tables ---------- */
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
  th { text-align:left; padding:8px 12px; font-size:10.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  [data-href] { cursor:pointer; }
  tr[data-href]:hover td { background:var(--hover); }
  td.num, th.num { text-align:right; }
  table.kv td:first-child { color:var(--muted); width:45%; }

  /* ---------- entity cells, avatars ---------- */
  .av { display:inline-grid; place-items:center; border-radius:50%; color:#fff; font-weight:700; flex:0 0 auto; letter-spacing:-.3px;
        background:linear-gradient(135deg, hsl(var(--h) 65% 52%), hsl(calc(var(--h) + 50) 70% 38%)); }
  .ent { display:inline-flex; align-items:center; gap:9px; min-width:0; vertical-align:middle; }
  .ent b a { color:var(--text); } .ent b a:hover { color:var(--accent); }
  .ent > span { min-width:0; }
  .ent small { display:block; color:var(--muted); font-size:11.5px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acct { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; }

  /* ---------- controls ---------- */
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .bar .spacer { flex:1; }
  input, select, button { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:7px 11px; font:inherit; font-size:13px; }
  input:focus, select:focus { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  input[type=search] { min-width:220px; }
  button { cursor:pointer; font-weight:600; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.35; cursor:default; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); } button.primary:hover { color:var(--accent-ink); filter:brightness(1.08); }
  td button { padding:3px 9px; font-size:12px; margin-right:3px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; padding:2px; background:var(--panel-2); }
  .seg button { border:0; background:transparent; padding:5px 11px; border-radius:8px; color:var(--muted); font-size:12.5px; }
  .seg button.on { background:var(--panel); color:var(--text); box-shadow:0 0 0 1px var(--line); }

  /* ---------- pills ---------- */
  .v { display:inline-block; padding:1px 9px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; border:1px solid transparent; white-space:nowrap; }
  .v.good { color:var(--good); background:var(--good-soft); border-color:color-mix(in srgb, var(--good) 35%, transparent); }
  .v.bad { color:var(--bad); background:var(--bad-soft); border-color:color-mix(in srgb, var(--bad) 35%, transparent); }
  .v.neutral { color:var(--neutral); background:var(--neutral-soft); border-color:color-mix(in srgb, var(--neutral) 35%, transparent); }
  .v.win80 { color:var(--win80); background:color-mix(in srgb, var(--win80) 14%, transparent); border-color:color-mix(in srgb, var(--win80) 40%, transparent); }
  .v.win50 { color:var(--win50); background:color-mix(in srgb, var(--win50) 14%, transparent); border-color:color-mix(in srgb, var(--win50) 40%, transparent); }
  .v.sniper { color:var(--sniper); background:color-mix(in srgb, var(--sniper) 14%, transparent); border-color:color-mix(in srgb, var(--sniper) 40%, transparent); }
  .v.win30 { color:var(--win30); background:color-mix(in srgb, var(--win30) 14%, transparent); border-color:color-mix(in srgb, var(--win30) 40%, transparent); }
  .v.loss { color:var(--loss); background:color-mix(in srgb, var(--loss) 14%, transparent); border-color:color-mix(in srgb, var(--loss) 40%, transparent); }
  .v.unrated { color:var(--muted); background:var(--unknown-soft); border-color:var(--line); }
  .v.unknown, .v.solo { color:var(--muted); background:var(--unknown-soft); border-color:var(--line); }
  .chip { display:inline-block; padding:0 8px; border:1px solid var(--line); background:var(--panel-2); border-radius:999px; font-size:11px; font-weight:600; color:var(--muted); margin-right:4px; white-space:nowrap; }
  .chip.ai { color:var(--purple); border-color:color-mix(in srgb, var(--purple) 35%, transparent); }

  /* ---------- early-money bar ---------- */
  .mix { display:flex; height:8px; min-width:120px; border-radius:99px; overflow:hidden; background:var(--line-2); gap:1px; }
  .mix.lg { height:14px; border-radius:7px; margin:4px 0 12px; }
  .mix i { display:block; height:100%; }
  .mix i.good, .lg-dot.good { background:var(--good); } .mix i.bad, .lg-dot.bad { background:var(--bad); } .mix i.neutral, .lg-dot.neutral { background:var(--neutral); }
  .mix i.win80, .lg-dot.win80 { background:var(--win80); } .mix i.win50, .lg-dot.win50 { background:var(--win50); } .mix i.win30, .lg-dot.win30 { background:var(--win30); } .mix i.sniper, .lg-dot.sniper { background:var(--sniper); } .mix i.loss, .lg-dot.loss { background:var(--loss); } .mix i.unrated, .lg-dot.unrated { background:var(--unknown); }
  .mix i.unknown, .lg-dot.unknown { background:var(--unknown); } .mix i.solo, .lg-dot.solo { background:var(--solo); }
  .lg-dot { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:baseline; }
  .mixcell { min-width:170px; } .mixcell small { display:block; color:var(--muted); font-size:11.5px; margin-top:3px; }
  .bar-score { display:inline-block; width:56px; height:6px; border-radius:4px; background:var(--line-2); vertical-align:middle; margin-right:7px; overflow:hidden; }
  .bar-score i { display:block; height:100%; background:var(--accent); }

  /* ---------- token cards, group list ---------- */

  .tcard { border:1px solid var(--line); border-radius:13px; padding:14px; background:var(--panel-2); display:flex; flex-direction:column; gap:11px; transition:border-color .12s, transform .12s; }
  .tcard:hover { border-color:var(--accent-line); transform:translateY(-1px); }

  .gchip.rug { border-color:color-mix(in srgb, var(--bad) 55%, transparent); }

  .tc-stats small { display:block; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
  .tc-stats b { font-size:13px; white-space:nowrap; }
  .tc-groups { display:flex; flex-wrap:wrap; gap:5px; min-height:20px; }

  .badge.g { background:var(--good-soft); } .badge.r { background:var(--bad-soft); } .badge.a { background:var(--neutral-soft); }
  .gchip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:1px 8px 1px 6px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); max-width:100%; }
  .gchip i { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .gchip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .glist { display:flex; flex-direction:column; gap:6px; }
  .gitem { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); }
  .gitem:hover { border-color:var(--accent-line); }
  .gitem b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .gitem small { color:var(--muted); font-size:11.5px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--muted); margin-top:8px; }
  .mixlegend { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
  .mixlegend div { padding:8px 10px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line-2); }
  .mixlegend b { display:block; font-size:15px; } .mixlegend small { color:var(--muted); font-size:11.5px; }

  /* ---------- AI + graphs ---------- */
  .ai { border:1px solid color-mix(in srgb, var(--purple) 35%, transparent); background:linear-gradient(160deg, color-mix(in srgb, var(--purple) 9%, var(--panel)), var(--panel)); border-radius:12px; padding:14px 16px; margin:0 0 16px; }
  .ai p { margin:8px 0; }
  ul.flags { margin:4px 0 8px 18px; padding:0; } ul.flags li { margin:3px 0; }
  svg.graph { width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:12px; display:block; }
  svg.bubbles { width:100%; max-height:560px; display:block; }
  svg.bubbles a circle { transition:opacity .1s; } svg.bubbles a:hover circle { opacity:.75; }

  footer { max-width:1440px; margin:0 auto; padding:0 24px 30px; color:var(--faint); font-size:12px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  footer a { color:var(--muted); font-weight:600; }

  @media (max-width:960px) {
    .topin { flex-wrap:wrap; gap:10px; padding:10px 16px; }
    .brand small { display:none; }

  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topin">
    <a class="brand" href="/explore" onclick="return navA(event,this)">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.7"/></svg></span>
      <span><b>Safe Near</b><small>Know who is behind the launch</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="search" id="topSearch"></div>
    <div class="status" id="statusBox" title="Is NEAR AI evaluating the data?"><i class="dot" id="statusDot"></i><span id="status"></span></div>
    <button class="icon-btn" title="Light / dark" onclick="toggleTheme()"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </div>
  <nav id="subnav" hidden></nav>
</header>
<div class="pagehead" id="pagehead"><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
<main id="main"></main>
<footer><span>Read-only on-chain. Comments and suggestions: <a href="https://t.me/poppingbean" target="_blank" rel="noopener">Telegram @poppingbean</a> · <a href="https://x.com/Raphael_Hoang" target="_blank" rel="noopener">X @Raphael_Hoang</a></span><span>Powered by <a href="https://trustflow.vn" target="_blank" rel="noopener">Trustflow.vn</a></span></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (x, d = 2) => (x == null || Number.isNaN(+x) ? '–' : (+x).toLocaleString('en-US', { maximumFractionDigits: d }));
const pct = (x, d = 0) => (x == null || Number.isNaN(+x) ? '–' : (x * 100).toFixed(d) + '%');
const when = (ts) => (ts ? new Date(ts).toLocaleString() : '–');
const ago = (ms) => { if (ms == null || Number.isNaN(ms)) return '–'; const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };
const since = (ts) => (ts ? ago(Date.now() - ts) + ' ago' : '–');
const short = (a, k = 18) => (a && a.length > k ? a.slice(0, k - 2) + '…' : a || '–');
const roiCls = (r) => (r == null ? 'muted' : r > 0 ? 'g' : r < 0 ? 'r' : 'muted');
const signed = (x, d = 1) => (x == null ? '–' : (x > 0 ? '+' : '') + n(x, d));
const TAGS = ['win80', 'win50', 'win30', 'sniper', 'loss', 'unrated'];
const tagOk = (t) => (TAGS.includes(t) ? t : 'unrated');
// the simulated wallet (paper trading) is hidden while it does not buy anything; set to true to show its page, tabs and labels again
const SHOW_SIM = false;
const TAGHELP = 'loss = lost money overall · net profit: win80 / win50 / win30 = ended in profit in 80 / 50 / 30 %+ of the tokens bought early, sniper = under 30 % (a few big wins pay for many small losses) · unrated = too few judged tokens';
/** Win-rate tag of a wallet or group (share of its early tokens that ended in profit). */
const tg = (t) => `<span class="v ${tagOk(t)}" title="${esc(TAGHELP)}">${tagOk(t)}</span>`;
const vb = (v) => `<span class="v ${esc(v || 'unknown')}">${esc(v === 'bad' ? 'dangerous' : v || 'unknown')}</span>`;
const tags = (t) => (t || []).map((x) => (x === 'creator-rug' ? '<span class="v bad" title="a token creator in this group rugged or is blacklisted">creator-rug</span> ' : `<span class="chip">${esc(x)}</span>`)).join('');
/** Creator warning chip from { launches, rugged, blacklisted: bool | {reason}, reason }. */
const crChip = (r) => {
  if (!r) return '';
  const bl = r.blacklisted, reason = (bl && typeof bl === 'object' ? bl.reason : r.reason) || '';
  if (bl) return `<span class="v bad" title="${esc(reason || 'on the dev-rug blacklist')}">creator blacklisted</span>`;
  if (r.rugged > 0) return `<span class="v bad" title="${r.rugged} of ${r.launches} launches rugged">creator rugged ${r.rugged}/${r.launches}</span>`;
  return '';
};
const crFlag = (f) => (f === 'blacklisted' ? '<span class="v bad">blacklisted</span>' : f === 'rugger' ? '<span class="v bad">rugger</span>' : f === 'creator' ? '<span class="v unrated">creator</span>' : '');
const get = async (path, params) => { const q = params ? '?' + new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null)) : ''; const r = await fetch(path + q); const j = await r.json(); if (j.error && !j.rows && !j.now && !j.nodes) throw new Error(j.error); return j; };

// ---- external links: every wallet / contract / transaction goes to NearBlocks, every token to its launchpad's token page
const NB = 'https://nearblocks.io', STOP = ' onclick="event.stopPropagation()"'; // a link inside a clickable row must not also open the row
const ext = (url, text, title) => `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title ?? text)}"${STOP}>${esc(text)}</a>`;
const ACCT_RE = /^[a-z0-9][a-z0-9._-]*$/;
const nbAddr = (a) => `${NB}/address/${encodeURIComponent(a)}`;
/** A wallet / contract account -> NearBlocks address page. Anything that is not an account id (labels, composite keys) is plain text. */
const acct = (a, k = 24) => (a ? (ACCT_RE.test(a) ? ext(nbAddr(a), short(a, k), a) : esc(short(a, k))) : '–');
const nb = (a) => acct(a, 22);
/** A transaction hash -> NearBlocks transaction page. */
const txl = (h) => (h ? ext(`${NB}/txns/${encodeURIComponent(h)}`, String(h).slice(0, 8) + '…', h) : '–');
// meme.cooking token pages use the meme id, which is not in the token account: the server lists them once
let MEME = {};
const loadMemeIds = () => fetch('/api/meme-ids').then((r) => r.json()).then((j) => { MEME = j.ids || {}; }).catch(() => {});
const padOf = (id) => (/\.nearlytrade\.near$/.test(id) ? 'nearlytrade' : /\.(v2-)?launchpad\.justhoot\.near$/.test(id) ? 'justhoot' : null);
const tokUrl = (id, lp) => {
  lp = lp || padOf(id);
  const e = encodeURIComponent(id);
  if (lp === 'nearlytrade') return `https://nearly.trade/${e}`;
  if (lp === 'justhoot') return `https://justhoot.fun/p/${e}`;
  if (lp === 'memecooking' && MEME[id]) return `https://meme.cooking/meme/${MEME[id]}`;
  return `${NB}/token/${e}`; // no launchpad page known for this token
};
/** A token -> its launchpad's token detail page (nearly.trade, justhoot.fun, meme.cooking), NearBlocks otherwise. */
const tokLink = (id, lp, k = 26) => (id ? ext(tokUrl(id, lp), short(id, k), id) : '–');

// ---- internal links: tokens, wallets and groups each have their own page
const P = { creator: (id) => '/creators/' + encodeURIComponent(id), tok: (id) => '/tokens/' + encodeURIComponent(id), wal: (id) => '/wallets/' + encodeURIComponent(id), grp: (id) => '/groups/' + encodeURIComponent(id),
  ent: (id) => '/entities/' + encodeURIComponent(id), scan: (id) => '/scans/' + encodeURIComponent(id), sim: (id) => '/sim/' + encodeURIComponent(id), audit: (id) => '/audit/' + encodeURIComponent(id), ana: (id) => '/analysis/' + encodeURIComponent(id), tgp: (id) => '/taggroups/' + encodeURIComponent(id), nft: (id) => '/nfts/' + encodeURIComponent(id) };
const row = (path) => `data-href="${esc(path)}" onclick="rowNav(event,this)"`;
const ilink = (path, html, title) => `<a href="${esc(path)}" onclick="event.stopPropagation();return navA(event,this)"${title ? ` title="${esc(title)}"` : ''}>${html}</a>`;
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const avatar = (id, label, size = 30) => `<span class="av" style="--h:${hue(id)};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px">${esc(String(label || id || '?').replace(/^[^a-z0-9]+/i, '').slice(0, 2).toUpperCase() || '?')}</span>`;
/** Token cell: avatar, symbol -> token page, account and a launchpad link. */
const tokCell = (id, sym, lp, k = 26) => `<span class="ent">${avatar(id, sym)}<span><b>${ilink(P.tok(id), esc(sym || short(id, 16)), id)}</b><small><span class="acct">${esc(short(id, k))}</span> ${ext(tokUrl(id, lp), '↗', 'open on ' + (lp || padOf(id) || 'NearBlocks'))}</small></span></span>`;
/** Wallet cell: account -> wallet page, plus NearBlocks. Non-account keys stay plain text. */
const walLink = (id, k = 24) => (!id ? '–' : ACCT_RE.test(id) ? `<span class="acct">${ilink(P.wal(id), esc(short(id, k)), id)}</span> ${ext(nbAddr(id), '↗', 'NearBlocks: ' + id)}` : esc(short(id, k)));
const VCOL = { win80: 'var(--win80)', win50: 'var(--win50)', win30: 'var(--win30)', sniper: 'var(--sniper)', loss: 'var(--loss)', unrated: 'var(--unknown)', solo: 'var(--solo)' };
const RUG_ICON = '☠';
const gchip = (g) => `<a class="gchip${g.rugger ? ' rug' : ''}" href="${esc(P.grp(g.id))}" onclick="event.stopPropagation();return navA(event,this)" title="${esc((g.label || g.id) + ' · ' + tagOk(g.tag) + (g.rugger ? ' · rugger group: contains a creator that rugged, or rug farmers' : ''))}"><i style="background:${VCOL[tagOk(g.tag)]}"></i>${g.rugger ? `<b class="r">${RUG_ICON}</b>` : ''}<span>${esc(short(g.label || g.id, 26))}</span>${g.wallets != null ? `<span class="muted">${g.wallets}w</span>` : ''}</a>`;
const tile = (label, value, sub, cls = '') => `<div class="tile"><span>${label}</span><b class="${cls}">${value}</b>${sub != null && sub !== '' ? `<small>${sub}</small>` : ''}</div>`;
const crumbs = (items) => `<div class="crumbs">${items.map(([l, p]) => (p ? ilink(p, esc(l)) : `<span>${esc(l)}</span>`)).join(' / ')}</div>`;
const empty = (cols, text) => `<tr><td colspan="${cols}" class="muted">${text}</td></tr>`;

// ---- early money split by win-rate tag (the group's tag, or the wallet's own when it has no group)
const MIXV = [['win80', 'win80 · profit in 80 %+ of tokens'], ['win50', 'win50 · 50 %+'], ['win30', 'win30 · 30 %+'], ['sniper', 'sniper · net profit, few big wins'], ['loss', 'loss · lost money'], ['unrated', 'unrated · too few tokens']];
const mixTotal = (m) => MIXV.reduce((s, [v]) => s + (m?.[v]?.near || 0), 0);
const mixBar = (m, cls = '') => {
  const tot = mixTotal(m);
  if (!tot) return '<div class="mix ' + cls + '"></div>';
  return `<div class="mix ${cls}">${MIXV.map(([v, l]) => { const x = m[v]?.near || 0; return x ? `<i class="${v}" style="width:${((x / tot) * 100).toFixed(2)}%" title="${l}: ${n(x, 1)} N · ${m[v].w} wallets (${pct(x / tot)})"></i>` : ''; }).join('')}</div>`;
};
const mixLegend = (m) => { const tot = mixTotal(m) || 1; return `<div class="mixlegend">${MIXV.map(([v, l]) => `<div><small><span class="lg-dot ${v}"></span>${l}</small><b>${pct((m[v]?.near || 0) / tot)}</b><small>${n(m[v]?.near || 0, 1)} N · ${m[v]?.w || 0} wallets</small></div>`).join('')}</div>`; };
const mixCell = (m, rug) => { const tot = mixTotal(m); if (!tot) return '<span class="muted">no early buyers yet</span>'; const w = MIXV.reduce((s, [v]) => s + (m[v]?.w || 0), 0);
  return `<div class="mixcell">${mixBar(m)}<small>${w} wallets · ${n(tot, 0)} N · <span class="g">${pct(((m.win80?.near || 0) + (m.win50?.near || 0) + (m.sniper?.near || 0)) / tot)}</span> / <span class="r">${pct((m.loss?.near || 0) / tot)}</span>${rug?.w ? ` · <b class="r" title="rugger wallets among the early buyers">${RUG_ICON} ${rug.w}w ${pct(rug.near / tot)}</b>` : ''}</small></div>`; };
const wavg = (pairs) => { const w = pairs.reduce((s, [, x]) => s + (x || 0), 0); return w ? pairs.reduce((s, [r, x]) => s + r * (x || 0), 0) / w : null; };

// ---- list state, filters, pager
const ST = { scans: { kind: '', pass: '', bought: '', q: '', offset: 0 }, entities: { type: '', q: '', sort: 'funded', offset: 0 }, groups: { tag: '', q: '', sort: 'size', offset: 0 }, taggroups: { only: '', sort: 'pnl', offset: 0 }, nfts: { tab: '', q: '', sort: '', offset: 0 }, alerts: { tab: '', group: '', offset: 0 },
  wallets: { q: '', tag: '', sort: 'tokens', offset: 0 }, creators: { q: '', filter: '', sort: '', offset: 0 }, tokens: { q: '', tab: '', status: '', launchpad: '', offset: 0 }, signals: { hours: 72 }, logs: { level: '' } };
const setSt = (view, field, value, reset = true) => { ST[view][field] = value; if (reset && 'offset' in ST[view]) ST[view].offset = 0; render(); };
const sel = (view, field, opts) => `<select onchange="setSt('${view}','${field}',this.value)">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(ST[view][field]) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const seg = (view, field, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${String(ST[view][field]) === String(v) ? 'on' : ''}" onclick="setSt('${view}','${field}','${esc(v)}')">${esc(l)}</button>`).join('')}</div>`;
const qbox = (view, ph) => `<input type="search" placeholder="${esc(ph)}" value="${esc(ST[view].q)}" onkeydown="if(event.key==='Enter')setSt('${view}','q',this.value)">`;
const pager = (view, total, size = 50) => { const o = ST[view].offset; return `<span class="muted">${total ? `${n(o + 1, 0)}–${n(Math.min(total, o + size), 0)} of ${n(total, 0)}` : '0'}</span>
  <button ${o ? '' : 'disabled'} onclick="ST.${view}.offset=Math.max(0,ST.${view}.offset-${size});render()">◀</button><button ${o + size < total ? '' : 'disabled'} onclick="ST.${view}.offset+=${size};render()">▶</button>`; };
/** One line: is NEAR AI evaluating the data right now? (the worker sends it the data; it reports every minute) */
const setStatus = (w, now, ai) => {
  const alive = w && now - w.ts < 5 * 60e3;
  const [cls, txt, why] = !ai.enabled ? ['', 'NEAR AI off', 'No NEAR AI key: groups get rule-based verdicts only']
    : !alive ? ['bad', 'NEAR AI paused', w ? `The background worker has not reported since ${when(w.ts)}` : 'The background worker has not started yet']
    : ai.ok === false ? ['bad', 'NEAR AI error', 'The last NEAR AI call failed; it is retried automatically']
    : ['ok', 'NEAR AI evaluating', `Last report ${ago(now - w.ts)} ago`];
  $('statusDot').className = 'dot ' + cls; $('status').textContent = txt; $('statusBox').title = why;
};
const aiBanner = (ai) => (!ai.enabled ? '<div class="card warn">NEAR AI is off (set NEAR_AI_API_KEY). Groups get rule-based verdicts only.</div>' : ai.ok === false ? `<div class="card err">NEAR AI error: ${esc(ai.error || '')}</div>` : '');
const views = {};

// ================================================================== EXPLORE
const ASSESS = { rugger: ['r', 'Rugger in'], bullish: ['g', 'Winners in'], warning: ['r', 'Loss wallets in'], mixed: ['a', 'Mixed money'] };
// Creator sales over every stored trade (what the rug check uses); falls back to the 24 h fields on old outcomes.
const creatorSale = (o) => {
  const b = o?.rug_basis;
  if (!b) return { sold: !!o?.creator_sold, near: o?.creator_sell_near || 0, after: 0 };
  return { sold: !!b.creator_sold, near: b.creator_sell_near || 0, after: b.creator_sell_after_24h_near || 0 };
};
const rugKind = { creator_exit: 'creator exit', round_trip: 'round trip', price_crash: 'price crash', creator_dump: 'creator dump', creator_sold: 'creator sold', flagged: 'dev rug (blacklist)' };
/** The creator sold (most of) their dev buy within the first hour: a warning, not a rug by itself. */
const exitChip = (o) => {
  const x = o?.creator_exit;
  if (x === true) return '<span class="v neutral">creator exit</span>';
  return x && x.share >= 0.8 && !(o.rug_kinds || []).includes('creator_exit') ? `<span class="v neutral" title="sold ${n(x.sold_near, 1)} N of a ${n(x.dev_buy_near, 1)} N dev buy within the first hour; first sale ${x.minutes} min after launch">creator exit · ${x.minutes} min</span>` : '';
};
/** Why a token counts as rugged, in plain words with its own on-chain numbers (no rule thresholds: safe on the public dashboard). */
function rugWhy(o, rug) {
  const b = o.rug_basis || o; // the all-time numbers the rug rules used (older outcomes: the 24 h ones)
  const after = o.rug_basis?.creator_sell_after_24h_near || 0, first = o.creator_sold ? o.creator_sell_near || 0 : 0;
  const lines = (o.rug_kinds || []).map((k) => {
    const txt = k === 'price_crash' ? `The price collapsed: it fell ${pct(b.drawdown)} from its peak (x${n(b.peak_multiple, 1)} of launch${b.peak_ts ? ', ' + when(b.peak_ts) : ''}) to x${n(b.last_multiple, 2)}.`
      : k === 'creator_dump' ? `The price fell ${pct(b.drawdown)} from its peak while the creator sold ${n(b.creator_sell_near, 2)} N of the token.`
      : k === 'round_trip' ? `It pumped to x${n(b.peak_multiple, 1)} of its launch price and came back to x${n(b.last_multiple, 2)}: everyone who bought after launch is flat or under.`
      : k === 'creator_exit' ? `The creator sold ${o.creator_exit && o.creator_exit !== true ? pct(o.creator_exit.share) + ' of' : 'most of'} their dev buy within the first hour${o.creator_exit?.minutes != null ? ` (first sale ${o.creator_exit.minutes} min after launch)` : ''}, and the price is back near launch (x${n(b.last_multiple, 2)}).`
      : k === 'creator_sold' ? ([first ? `${n(first, 2)} N in the first 24 h` : '', after ? `${n(after, 2)} N after the first 24 h` : ''].filter(Boolean).length ? `The creator sold their own token: ${[first ? `${n(first, 2)} N in the first 24 h` : '', after ? `${n(after, 2)} N after the first 24 h` : ''].filter(Boolean).join(' and ')}.` : rug?.source === 'ledger' && rug.reason ? `The creator ${rug.reason}.` : 'The creator sold some of their own token.')
      : k === 'flagged' ? `The creator is on the dev-rug blacklist: their token balance dropped while the token was being held${o.rug_reason ? ` (${o.rug_reason})` : ''}.`
      : 'Flagged as rugged.';
    return `<li><b>${esc(rugKind[k] || k)}</b> · ${esc(txt)}</li>`;
  });
  if (!lines.length) lines.push(`<li>${rug?.source === 'blacklist' ? 'The creator is on the dev-rug blacklist: their token balance dropped while the token was being held.' : 'Flagged as rugged. Use Re-analyse to apply the latest rules.'}</li>`);
  if (o.rug_basis?.trades != null) lines.push(`<li class="muted small">Judged on all ${n(o.rug_basis.trades, 0)} stored trades${o.rug_basis.last_trade_ts ? ', up to ' + when(o.rug_basis.last_trade_ts) : ''}.</li>`);
  return lines.join('');
}
const rugChips = (o) => (o?.rugged ? (o.rug_kinds?.length ? o.rug_kinds : ['rug']).map((k) => `<span class="v bad" title="${esc(o.rug_reason || 'rugged')}">${esc(rugKind[k] || 'rug')}</span>`).join(' ') : '');
/** A token's latest multiple: today's price once its full ledger is read, otherwise the 24 h one (marked "24h" once that window is over). */
const xm = (m) => 'x' + n(m, m != null && m < 0.1 ? 3 : m != null && m < 10 ? 2 : 1); // a price multiple: a dead token still reads as x0.004, not x0
const nowX = (m, at24) => `<span class="${roiCls((m ?? 1) - 1)}"${at24 ? ' title="price at 24 h: trades after the first day are not read yet"' : ''}>${xm(m)}${at24 ? '<small class="muted"> 24h</small>' : ''}</span>`;
const nowOf = (t) => (t?.ledger?.last_multiple != null ? nowX(t.ledger.last_multiple, false) : nowX(t?.outcome?.last_multiple, t?.status === 'done'));
const outcomeTxt = (o) => (o ? (o.rugged ? '<span class="r">RUG</span> ' : '') + (o.now_multiple != null ? nowX(o.now_multiple, false) : nowX(o.last_multiple, o.done)) : '–');
const signalCard = (s) => `<div class="tcard" ${row(P.tok(s.token))}>
  <div class="tc-top">${tokCell(s.token, s.symbol, s.launchpad, 22)}<span class="badge ${ASSESS[s.assessment][0]}">${ASSESS[s.assessment][1]}</span></div>
  ${mixBar(s.mix)}
  <div class="tc-stats"><span><small>Early</small><b>${s.early_wallets}w · ${n(s.total_near, 0)} N</b></span><span><small>Winners</small><b class="g">${pct(s.win_share)}</b></span><span><small>Loss</small><b class="r">${pct(s.loss_share)}</b></span><span><small>Now</small><b>${outcomeTxt(s.outcome)}</b></span></div>
  ${s.rugger?.w ? `<div class="rugline" title="token creators that rugged or are blacklisted, and wallets in groups that contain one or that are rug farmers">${RUG_ICON} ${s.rugger.w} rugger${s.rugger.w > 1 ? 's' : ''} in early · ${n(s.rugger.near, 0)} N · ${pct(s.rugger_share)}</div>` : ''}
  <div class="tc-groups">${s.groups.slice(0, 4).map(gchip).join('')}</div>

const groupMini = (rows, empty_) => `<table><tr><th>Group</th><th>Tag</th><th class="num">Wallets</th><th class="num">Tokens</th><th class="num">Profitable</th><th class="num">Rug</th><th class="num">P&amp;L N</th></tr>

/** Scanner state of a launch: observing / checking / gates fail / pass / bought (simulated). */
// ---- why a token failed the scanner: a plain explanation per gate. This is what the public dashboard shows: it names the check that
// failed without its threshold, so a rugger cannot learn the numbers to get past it. (When running locally the server also sends the
// exact reason, shown under it.)
const GATE_TEXT = {
  quote_accepted: 'Its pool is quoted in a token the scanner cannot trade.',
  standard_contract: "The token contract is not the launchpad's standard code (custom code can hide a honeypot).",
  lp_locked: 'Liquidity is not locked by the launchpad, so it can be pulled.',
  min_pool_near: 'Too little NEAR in the pool.',
  min_mcap: 'Market cap too small.',
  min_buyers: 'Too few independent wallets had bought it at the time of the check.',
  creator_not_selling: 'The creator had already sold some of the token.',
  tax_ok: 'The buy / sell tax is too high.',
  no_sybil_cluster: 'Too much of the buying came from wallets linked to each other or to the creator.',
  creator_not_funding_buyers: 'The creator funded some of the buyers.',
  not_overextended: 'The price had already run up too far since the first trade.',
  quote_available: 'No tradable quote for the buy size (the pool is too thin).',
  contract_audit_ok: 'The contract audit found a dangerous finding or a high risk score.',
  creator_clean_history: 'The creator launched tokens before that were rugged or dumped.',
  creator_network_clean: 'Other token creators tied to this one by funding or payments have rugged.',
  bad_groups_not_dominant: 'Wallets from groups judged dangerous made up too much of the early buying.',
  no_ai_manipulation: 'The token name or symbol tries to give instructions to AI reviewers.',
};
const gateId = (g) => (typeof g === 'string' ? g : g?.id);
const gateText = (g) => GATE_TEXT[gateId(g)] || String(gateId(g) || 'unknown check').replace(/_/g, ' ');
/** The reasons a scanner check failed, readable: one line per failed gate, or the low score when every gate passed. */
function failReasons(s) {
  if (!s) return '';
  if (s.stale) return '<p class="muted">Not checked: the token was not checked within its first hour.</p>';
  if (s.error) return `<p class="r">The check could not run${typeof s.error === 'string' ? ': ' + esc(s.error) : ''}.</p>`;
  if (s.pass !== false) return '';
  const failed = s.failed || [];
  const items = failed.map((g) => `<li><b class="r">${esc(gateId(g))}</b> <span class="muted">${esc(gateText(g))}</span>${g?.why ? `<div class="muted small">${esc(g.why)}</div>` : ''}</li>`);
  if (!failed.length) items.push(`<li><b class="r">score</b> <span class="muted">Every gate passed, but the overall rule score${s.score != null ? ` (${esc(s.score)})` : ''} was too low to buy.</span></li>`);
  return `<ul class="flags">${items.join('')}</ul>`;
}
/** The failed gate codes in one red line, e.g. "min_pool_near, min_mcap, min_buyers" (the explanations are in the tooltip). */
const gateCodes = (s) => (s?.pass !== false ? '' : (s.failed || []).length ? `<span class="r">${esc(s.failed.map(gateId).join(', '))}</span>` : '<span class="r">score</span>');
const failTitle = (s) => (s?.pass === false ? ((s.failed || []).length ? s.failed.map(gateText).join('\n') : 'every gate passed, but the rule score was too low') : '');

const scanState = (t, scanCfg) => {
  if (t.status === 'skipped_quote') return '<span class="muted">skipped (quote not tradable)</span>';
  if (t.status === 'awaiting_pool') return '<span class="muted">waiting for its pool</span>';
  if (t.track_only) return '<span class="chip">tracking only</span>';
  const s = t.scan;
  if (s?.stale) return '<span class="muted">stale</span>';
  if (s?.error) return '<span class="r">error</span>';
  if (s?.score != null && s.ai_pending) return Date.now() - s.ts < 15 * 60e3 ? '<span class="v good">gates pass</span> <span class="b small">AI reviewing…</span>' : '<span class="v good">gates pass</span> <span class="muted small">AI review did not finish</span>';
  if (s?.score != null) return s.bought && SHOW_SIM ? '<span class="v good">bought (sim)</span>' : s.pass ? `<span class="v neutral">${SHOW_SIM ? 'pass, no buy' : 'gates pass'}</span>` : '<span class="v bad">gates fail</span>';
  const minAge = Math.max(scanCfg.observeSeconds, t.launchpad === 'justhoot' ? scanCfg.justhootMinAgeSeconds : 0) * 1000;
  const left = minAge - (Date.now() - t.live_ts);
  return left > 0 ? '<span class="b">observing</span>' : '<span class="b">checking…</span>';
};

function fetchPage(id) {

let fetchTimer = null;
/** "Re-analyse": re-apply the latest rug rules to the stored trades of this token, then show the page again. */
async function reanalyse(id) {
  const box = document.getElementById('fetchState');
  if (box) box.innerHTML = '<span class="b">re-analysing with the latest rules…</span>';
  try {
    const j = await get('/api/reanalyse', { id });
    if (j.error) { if (box) box.innerHTML = `<span class="r">${esc(j.error)}</span>`; return; }
    if (box) box.innerHTML = `<span class="${j.rugged ? 'r' : 'g'}">Re-analysed${j.trades != null ? ` ${n(j.trades, 0)} trades` : ''} with the latest rules: ${j.rugged ? 'rugged (' + esc((j.rug_kinds || []).map((k) => rugKind[k] || k).join(', ')) + ')' : 'not rugged'}${j.was_rugged !== j.rugged ? ` · was ${j.was_rugged ? 'rugged' : 'not rugged'} before` : ' · no change'}</span>`;
    setTimeout(render, 1500);
  } catch (e) { if (box) box.innerHTML = `<span class="r">${esc(e.message)}</span>`; }
}
async function startFetch(id) {
  const box = () => document.getElementById('fetchState');
  if (!box()) return;
  clearTimeout(fetchTimer);
  const show = (html) => { if (box()) box().innerHTML = html; };
  try {
    let j = await get('/api/fetch-token', { id });
    const poll = async () => {
      if (location.pathname !== P.tok(id) && decodeURIComponent(location.pathname) !== P.tok(id)) return; // the user went elsewhere
      if (j.error) { show(`<span class="r">${esc(j.error)}</span>`); return; }
      if (j.state === 'running') { show(`<span class="b">${esc(j.step || 'working')}…</span>`); fetchTimer = setTimeout(async () => { j = await get('/api/fetch-status', { id }).catch(() => j); if (j.exists && (j.state !== 'running' || /auditing|analysis/.test(j.step || ''))) render(); else poll(); }, 2500); return; }
      if (j.state === 'error') { show(`<span class="r">Could not fetch it: ${esc(j.message || 'unknown error')}</span> <button onclick="startFetch('${esc(id)}')">Try again</button>`); return; }
      if (j.exists) { render(); return; }
      show(`<span class="muted">${esc(j.message || 'Nothing was stored.')}</span>`);
    };
    await poll();
  } catch (e) { show(`<span class="r">${esc(e.message)}</span>`); }
}

/** When the token's data was last synced and when it is next; "Sync now" reads it from the chain right away and re-runs the analysis. */
function syncBanner(t) {
  const due = t.next_process_ts != null && t.next_process_ts <= Date.now();
  let txt, cls = 'unrated';
  if (t.status === 'awaiting_pool') txt = 'Waiting for its pool: checked again every 10 minutes. Sync now looks for it right away.';
  else if (t.status === 'no_pool') txt = 'No pool found in its first week. Sync now looks for it again.';
  else if (t.status === 'skipped_quote') txt = 'Not synced: its pool is quoted in a token that cannot be valued in NEAR.';
  else if (!t.processed_ts) { txt = 'Not synced yet: queued for its first sync (the newest launches go first). Trades and early buyers appear after it.'; cls = 'win30'; }
  else if (t.status === 'done') {
    // first 24 h read (what verdicts use); the full ledger follows it up to today
    const L = t.ledger;
    txt = `Rug check uses every stored trade${t.outcome?.rug_basis?.trades != null ? ` (${n(t.outcome.rug_basis.trades, 0)})` : ''}; win / loss tags use the first 24 h · `;
    if (!L) txt += 'full ledger: queued, the newest tokens are read first';
    else if (L.error && !L.caught_up) txt += `full ledger: last pass failed (${L.error}), retried in ${ago(Math.max(0, (L.next_ts ?? Date.now()) - Date.now()))}`;
    else if (!L.caught_up) txt += `full ledger: reading, ${n(t.trades_n, 0)} trades so far, up to ${when(L.synced_to_ts)}`;
    else txt += `full ledger up to date · synced ${since(L.synced_ts)} · ${L.stopped ? `no longer followed (${L.stopped}): use Sync now to read it again` : `next sync in ${ago(Math.max(0, L.next_ts - Date.now()))}`}`;
    if (L?.caught_up) cls = 'win80';
  }
  else txt = `Last synced ${since(t.processed_ts)} · next sync ${due ? 'due now' : 'in ' + ago(t.next_process_ts - Date.now())}`;
  return `<div class="banner"><span class="v ${cls}">sync</span><div style="flex:1;min-width:0"><span class="small">${esc(txt)}</span><div id="fetchState" class="small"></div></div>${t.processed_ts ? `<button title="Re-apply the latest rug rules to every stored trade of this token (no chain reads)" onclick="reanalyse('${esc(t.id)}')">Re-analyse</button>` : ''}${t.status === 'skipped_quote' ? '' : `<button onclick="startFetch('${esc(t.id)}')">Sync now</button>`}</div>`;
}

/** Bubble map: one bubble per early buyer (area ~ NEAR in), packed inside one circle per group, groups packed around the biggest. */
function bubbleMap(entries) {
  if (!entries.length) return '<p class="muted">no early buyers recorded</p>';
  const buckets = new Map();
  for (const e of entries) { const k = e.cluster ? e.cluster.id : ''; const b = buckets.get(k) || { key: k, c: e.cluster, items: [], near: 0 }; b.items.push(e); b.near += e.buy_near || 0; buckets.set(k, b); }
  const maxN = Math.max(...entries.map((e) => e.buy_near || 0), 0.01);
  const pack = (cs, gap) => { // greedy: biggest first, each next one at the first free spot on an outward spiral
    const done = [];
    for (const c of cs) {
      if (!done.length) { c.x = 0; c.y = 0; done.push(c); continue; }
      for (let a = 0; ; a += 0.2) { const d = 0.9 * a, x = d * Math.cos(a), y = d * Math.sin(a); if (done.every((p) => Math.hypot(p.x - x, p.y - y) >= p.r + c.r + gap)) { c.x = x; c.y = y; break; } }
      done.push(c);
    }
    return done;
  };
  const groups = [...buckets.values()].sort((a, b) => b.near - a.near).map((b) => {
    const cs = pack(b.items.map((e) => ({ e, r: 4 + 18 * Math.sqrt((e.buy_near || 0) / maxN) })).sort((x, y) => y.r - x.r), 1.5);
    return { ...b, cs, r: Math.max(...cs.map((c) => Math.hypot(c.x, c.y) + c.r)) + 7 };
  });
  pack(groups, 30);
  const x0 = Math.min(...groups.map((g) => g.x - g.r)) - 6, x1 = Math.max(...groups.map((g) => g.x + g.r)) + 6;
  const y0 = Math.min(...groups.map((g) => g.y - g.r)) - 20, y1 = Math.max(...groups.map((g) => g.y + g.r)) + 6;
  const W = Math.max(x1 - x0, 320), fs = Math.max(9, W / 85);
  const svg = groups.map((g) => {
    const v = g.c ? tagOk(g.c.tag) : 'solo', col = VCOL[v];
    const label = g.c ? `${short(g.c.label || g.c.id, 24)} · ${g.items.length}` : `unlinked · ${g.items.length}`;
    const ring = `<circle cx="${g.x}" cy="${g.y}" r="${g.r}" style="fill:${col};fill-opacity:.07;stroke:${col};stroke-opacity:.55" stroke-width="1.2" ${g.c ? '' : 'stroke-dasharray="4 4"'}/>`;
    const lbl = `<text x="${g.x}" y="${g.y - g.r - 5}" text-anchor="middle" font-size="${fs}" style="fill:var(--muted)" font-weight="600">${esc(label)}</text>`;
    const dots = g.cs.map((c) => `<a href="${esc(P.wal(c.e.wallet))}" onclick="return navA(event,this)"><circle cx="${g.x + c.x}" cy="${g.y + c.y}" r="${c.r}" style="fill:${VCOL[tagOk(c.e.tag)]}" fill-opacity="${g.c ? 0.85 : 0.9}" ${c.e.is_creator ? 'stroke="var(--bad)" stroke-width="2.5"' : ''}><title>${esc(c.e.wallet)}\n${n(c.e.buy_near, 2)} N in · rank #${c.e.rank} · ${c.e.delay_s}s after open\nROI now ${pct(c.e.roi_now)}\n${esc(tagOk(c.e.tag))}${g.c ? ' - group ' + esc(g.c.label || g.c.id) : ''}${c.e.is_creator ? '\nCREATOR' : ''}</title></circle></a>`).join('');
    return (g.c ? `<a href="${esc(P.grp(g.c.id))}" onclick="return navA(event,this)">${ring}${lbl}</a>` : ring + lbl) + dots;
  }).join('');
  return `<svg class="bubbles" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
}

// Funding & money-flow graph. Full view: funders on top, member wallets in the middle, destinations of NEAR at the bottom, long rows
// wrapped. Click an address: only the wallets it received NEAR from (above) or sent NEAR to (below) stay; Reset shows everyone again.
const GRAPHS = {};
const GMAX_ROW = 28; // nodes per row before a level wraps onto another row
function graphBlock(g, key = 'g') {
  GRAPHS[key] = { g, focus: null };
  return `<div id="graph-${key}">${graphView(key)}</div>`;
}
function graphFocus(key, id) { const st = GRAPHS[key]; if (!st) return; st.focus = st.focus === id ? null : id; $(`graph-${key}`).innerHTML = graphView(key); }
function graphReset(key) { const st = GRAPHS[key]; if (!st) return; st.focus = null; $(`graph-${key}`).innerHTML = graphView(key); }
function graphView(key) {
  const { g, focus } = GRAPHS[key];
  if (!g?.nodes?.length) return '<p class="muted">no graph data</p>';
  const byId = new Map(g.nodes.map((x) => [x.id, x]));
  let nodes, edges, rows;
  if (focus) {
    // only the transfers in and out of the focused address, and the addresses on their other end
    edges = g.edges.filter((e) => e.from === focus || e.to === focus);
    const inn = new Set(edges.filter((e) => e.to === focus).map((e) => e.from)), out = new Set(edges.filter((e) => e.from === focus).map((e) => e.to));
    const both = [...inn].filter((x) => out.has(x));
    rows = [[...inn].filter((x) => !out.has(x)), both, [focus], [...out].filter((x) => !inn.has(x))].filter((r) => r.length);
    nodes = new Set([focus, ...inn, ...out]);
  } else {
    edges = g.edges;
    const lvl = new Map(g.nodes.map((x) => [x.id, x.member ? 0 : null]));
    const fund = edges.filter((e) => e.type === 'fund'), flow = edges.filter((e) => e.type === 'flow');
    for (let pass = 0; pass < 6; pass++) for (const e of fund) { const c = lvl.get(e.to), f = lvl.get(e.from); if (c != null && lvl.has(e.from) && (f == null || f > c - 1)) lvl.set(e.from, c - 1); } // funders above whoever they fund
    for (const e of flow) if (lvl.has(e.to) && lvl.get(e.to) == null) lvl.set(e.to, 1);
    for (const [id, v] of lvl) if (v == null) lvl.set(id, -1);
    rows = [...new Set(lvl.values())].sort((a, b) => a - b).map((v) => [...lvl].filter(([, x]) => x === v).map(([id]) => id));
    nodes = new Set(g.nodes.map((x) => x.id));
  }
  // wrap long rows so a big group does not become one solid bar
  const lines = rows.flatMap((r) => Array.from({ length: Math.ceil(r.length / GMAX_ROW) }, (_, k) => r.slice(k * GMAX_ROW, (k + 1) * GMAX_ROW)));
  const W = 1000, rowH = focus ? 130 : 90, H = lines.length * rowH + 40, pos = new Map();
  lines.forEach((r, li) => r.forEach((id, i) => pos.set(id, { x: 20 + ((i + 0.5) * (W - 40)) / r.length, y: 34 + li * rowH + (r.length > 12 && !focus ? (i % 2) * 14 : 0) })));
  const node = (id) => byId.get(id) || { id, member: false, kind: null };
  const color = (x) => (x.member ? 'var(--accent)' : x.kind === 'wallet' || x.kind == null ? 'var(--neutral)' : 'var(--unknown)');
  const labels = focus || nodes.size <= 40;
  const edgeSvg = edges.map((e) => { const a = pos.get(e.from), b = pos.get(e.to); if (!a || !b) return ''; const col = e.type === 'fund' ? 'var(--good)' : 'var(--bad)';
    const mid = a.y === b.y ? `${(a.x + b.x) / 2},${a.y - 40}` : null;
    const d = mid ? `M${a.x},${a.y} Q${mid} ${b.x},${b.y}` : `M${a.x},${a.y} C${a.x},${(a.y + b.y) / 2} ${b.x},${(a.y + b.y) / 2} ${b.x},${b.y}`;
    const amt = focus && e.near ? `<text x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 4}" text-anchor="middle" font-size="10" pointer-events="none" style="fill:${col}">${esc(n(e.near, 1))} N</text>` : '';
    return `<path d="${d}" fill="none" pointer-events="none" style="stroke:${col}" stroke-opacity="${focus ? 0.8 : 0.5}" stroke-width="${Math.min(3.5, 0.8 + Math.log10(1 + (e.near || 0)))}"><title>${e.type === 'fund' ? 'funded' : 'NEAR sent'}: ${esc(short(e.from, 24))} → ${esc(short(e.to, 24))} · ${n(e.near, 2)} N${e.n ? ' · ' + e.n + ' transfers' : ''}</title></path>${amt}`; }).join('');
  const nodeSvg = [...nodes].map((id) => { const x = node(id), p = pos.get(id); if (!p) return ''; const me = id === focus;
    return `<g style="cursor:pointer" onclick="graphFocus('${key}', this.dataset.id)" data-id="${esc(id)}"><circle cx="${p.x}" cy="${p.y}" r="${me ? 16 : 11}" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="${me ? 11 : x.member ? 7 : 5}" style="fill:${color(x)}${me ? ';stroke:var(--text);stroke-width:2.5' : ''}"><title>${esc(id)}${x.kind ? ' · ' + esc(x.kind) : ''}${x.tx_count != null ? ' · ' + x.tx_count + ' txs' : ''}\nclick: ${me ? 'show everyone again' : 'show only its transfers'}</title></circle>${labels ? `<text x="${p.x}" y="${p.y + (me ? 26 : 18)}" style="fill:${me ? 'var(--text)' : 'var(--muted)'}" font-size="${me ? 12 : 9}" font-weight="${me ? 700 : 400}" text-anchor="middle">${esc(short(id, me ? 30 : 14))}</text>` : ''}</g>`; }).join('');
  let bar;
  if (focus) {
    const x = node(focus), inN = new Set(edges.filter((e) => e.to === focus).map((e) => e.from)).size, outN = new Set(edges.filter((e) => e.from === focus).map((e) => e.to)).size;
    const page = x.member ? ilink(P.wal(focus), 'Wallet page →') : ilink(P.ent(focus), 'Entity page →');
    bar = `<div class="bar" style="margin-bottom:8px"><span>Showing <b class="acct">${esc(short(focus, 40))}</b> · <span class="g">${inN} sent NEAR to it</span> · <span class="r">${outN} received NEAR from it</span></span>${page}${ext(nbAddr(focus), 'NearBlocks ↗')}<span class="spacer"></span><button class="primary" onclick="graphReset('${key}')">Reset · show all ${g.nodes.length}</button></div>`;
  } else bar = `<div class="muted small" style="margin-bottom:6px">Click an address to show only the wallets it received NEAR from or sent NEAR to.</div>`;
  return `${bar}<svg class="graph" viewBox="0 0 ${W} ${H}">${edgeSvg}${nodeSvg}</svg>`;
}

const LV = { low: 'good', medium: 'neutral', high: 'bad', critical: 'bad', unrated: 'unknown', high_trust: 'good' };
const CAT = { critical: 'Critical', ownership: 'Ownership & control', trading: 'Trading', liquidity: 'Liquidity', trust: 'Trust signals' };
const gauge = (label, score, level, kind) => {
  const v = score ?? 0, col = kind === 'risk' ? (v >= 70 ? '#dc2626' : v >= 45 ? '#ea580c' : v >= 20 ? '#d97706' : '#16a34a') : (v >= 70 ? '#16a34a' : v >= 40 ? '#0ea5e9' : v >= 15 ? '#d97706' : '#94a3b8');
  return `<div class="tile"><span>${label}</span><b style="color:${col}">${score ?? '–'}<span class="muted" style="font-size:13px;font-weight:500"> / 100 · ${esc(level || '–')}</span></b><div style="height:6px;border-radius:5px;background:var(--line-2);margin-top:8px;overflow:hidden"><div style="height:100%;width:${v}%;background:${col}"></div></div></div>`;
};
function auditBody(a) {
  if (a.error) return `<div class="card err">${esc(a.error)}</div>`;
  if (a.notFound) return `<div class="card warn">${esc(a.address)}: there is no contract deployed on this account (a plain wallet), nothing to audit.</div>`;
  const sum = a.summary || {};
  let h = `<div class="card"><div class="bar"><h2 style="margin:0">${esc(a.address)}${a.tokenSymbol ? ' · ' + esc(a.tokenSymbol) : ''} <span class="chip">${esc(a.kind)}</span></h2><span class="muted">audited ${when(a.fetchedAt)}${a.cached ? ' (cached ≤ 1 h)' : ''}</span>${a.kind === 'token' ? ilink(P.tok(a.address), 'Token page →') : ''}<span class="spacer"></span><button onclick="runAudit('${esc(a.address)}',true)">Re-run</button></div>
    <div class="tiles">${gauge('Risk score (higher = riskier)', a.risk.score, a.risk.level, 'risk')}${gauge('Trust score', a.trust.score, a.trust.level, 'trust')}
    ${tile('Full-access keys', sum.full_access_keys ?? '–')}${tile('Confirmed malicious findings', (sum.confirmed_malicious || []).length, null, (sum.confirmed_malicious || []).length ? 'r' : 'g')}${tile('Recent sells', sum.sells ? sum.sells.ok + ' ok / ' + sum.sells.failed + ' failed' : '–')}</div>`;
  if ((sum.confirmed_malicious || []).length) h += `<p class="r"><b>Confirmed:</b> ${sum.confirmed_malicious.map((c) => esc(c.key) + (c.detail ? ' (' + esc(c.detail) + ')' : '')).join(' · ')}</p>`;
  h += '</div>';
  const all = [...a.risk.factors, ...a.trust.factors.filter((f) => !a.risk.factors.some((x) => x.key === f.key))];
  const groups = {};
  for (const f of all) (groups[f.category] ||= []).push(f);
  h += '<div class="card"><h2>Findings</h2>' + (all.length ? '' : '<p class="muted">Nothing found.</p>') + '<table><tr><th>Result</th><th>Finding</th><th>Detail</th></tr>' +
    ['critical', 'ownership', 'trading', 'liquidity', 'trust'].filter((c) => groups[c]).map((c) => `<tr><td colspan="3" style="background:var(--panel-2);font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.7px;text-transform:uppercase">${CAT[c]}</td></tr>` + groups[c].map((f) => `<tr><td>${f.category === 'trust' ? (f.hit ? '<span class="v good">earned</span>' : '<span class="v unknown">not earned</span>') : f.hit ? (f.weight == null || f.weight > 0 ? '<span class="v bad">hit</span>' : '<span class="v unknown">note</span>') : '<span class="v good">pass</span>'}</td><td class="wrap">${esc(f.label)}</td><td class="wrap muted">${esc(f.detail || '')}</td></tr>`).join('')).join('') + '</table></div>';
  const code = a.raw?.code;
  if (code) h += `<div class="card"><h2>Code <span class="muted">${code.exports.length} exported functions</span></h2>${code.fakeStorage.length ? `<p class="r">Fake storage methods: ${code.fakeStorage.map(esc).join(', ')}</p>` : ''}${(code.privilegedNames || []).length ? `<p class="a">Privileged methods: ${code.privilegedNames.map(esc).join(', ')}</p>` : ''}${code.nonStandard.length ? `<p>Non-standard methods: ${code.nonStandard.map(esc).join(', ')}</p>` : '<p class="muted">No methods outside the standards.</p>'}</div>`;
  if (a.raw?.tax) h += `<div class="card"><h2>Launchpad tax</h2><pre>${esc(JSON.stringify(a.raw.tax, null, 1))}</pre></div>`;
  return h;
}

const lineSvg = (pts, { fmt = (v) => n(v, 2), base = null } = {}) => {
  if (pts.length < 2) return '<p class="muted">not enough data points yet (a point is stored every 5 minutes while the worker runs)</p>';
  const W = 1000, H = 120, xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), lo = Math.min(...ys, base ?? Infinity), hi = Math.max(...ys, base ?? -Infinity);
  const sx = (x) => 8 + ((x - x0) / (x1 - x0 || 1)) * (W - 16), sy = (y) => H - 10 - ((y - lo) / (hi - lo || 1)) * (H - 20);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
  const b = base != null ? `<line x1="0" x2="${W}" y1="${sy(base)}" y2="${sy(base)}" style="stroke:var(--faint)" stroke-dasharray="4 4"/>` : '';
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:120px">${b}<path d="${d}L${sx(x1)},${H}L${sx(x0)},${H}Z" style="fill:var(--accent-soft)"/><path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg><div class="muted small" style="display:flex;justify-content:space-between;margin-top:4px"><span>${esc(when(x0))}</span><span>min ${fmt(lo)} · max ${fmt(hi)}</span><span>${esc(when(x1))}</span></div>`;
};

async function watchKey(create) {

  try {
    const html = detail ? await DETAIL[view](id) : await views[view]();
    if (my === seq) { $('main').innerHTML = html; if (view === 'audit' && id) runAudit(id); if (view === 'analysis' && id) anaPoll(id); if (view === 'nfts' && id) nftPoll(id); }
  } catch (e) { if (my === seq) $('main').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  if (my === seq) $('main').classList.remove('loading');
}
$('topSearch').outerHTML = searchBox('topQ');
const loadStatus = () => get('/api/monitor').then((m) => setStatus(m.worker, m.now, m.ai)).catch(() => {});
loadStatus(); setInterval(loadStatus, 60000);
window.addEventListener('popstate', render);
Promise.all([loadMemeIds(), loadWatch().catch(() => {})]).then(render);
setInterval(loadMemeIds, 600000);
// list pages refresh every 30 s; detail pages, open search results and focused inputs are left alone
setInterval(() => { if (location.pathname.split('/').filter(Boolean).length < 2 && !document.querySelector('.sr.open') && !['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) render(); }, 30000);
</script>
